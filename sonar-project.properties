# What SonarCloud measures. `sonar.yml` runs the scanner over this tree on `workflow_run`, from main's copy,
# and forces the server, the organization and the project on the command line, which wins over this file: a
# branch can change what is measured, and cannot send the analysis token anywhere else. The three are stated
# here too so a local run reaches the same project.
sonar.host.url=https://sonarcloud.io
sonar.organization=payabli
sonar.projectKey=payabli_sdk-android
sonar.sourceEncoding=UTF-8

# The sample app is not the SDK. It has no consumers and is not published, and a rating that moves because a
# demo screen changed says nothing about the artifact a partner links, so it is not a module here. CI still
# builds, tests, lints and formats it; the results report nowhere. The BOM declares no code.
sonar.modules=core,payin,taptopay,telemetry,testutils,payabli-android

# The root module carries the CI scripts and the sample's token server: analysed for issues and duplication,
# and excluded from coverage below.
sonar.sources=.github,example-server

# Binary resources are not source.
sonar.exclusions=**/build/**,**/*.webp,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ttf,**/*.otf

# Coverage only, so these files still get issue detection and duplication.
#
# A `platform` package binds directly to an Android API with no JVM implementation, Keystore and
# `android.util.*`. Part of what covers it is hardware the emulator job does not have: two of :core's platform
# tests assert the storage and device keys are in secure hardware, which an emulator fails with
# SECURITY_LEVEL_SOFTWARE, so they carry @ManualDeviceTest and no automated run executes them. Measured on a
# handset with that tier excluded, the `platform` packages read 72.0% line. Revisit against a measurement.
#
# The test fixtures run from every other module's tests, and JaCoCo instruments only a module's own classes,
# so none of that execution is attributable to them.
#
# The sample app, its token server and the CI scripts ship in nothing, so coverage over them would report the
# demonstration's testing as though it were the product's.
sonar.coverage.exclusions=**/platform/**,**/sdk/testutils/**,**/com/payabli/example/**,example-server/**,.github/**

# One rule over one path each. `@Suppress("LongParameterList")` is not honoured by the analyser.
sonar.issue.ignore.multicriteria=copyMirrorsItsProperties,formEntryComposable,formContentComposables,libraryManifestBackup
sonar.issue.ignore.multicriteria.copyMirrorsItsProperties.ruleKey=kotlin:S107
sonar.issue.ignore.multicriteria.copyMirrorsItsProperties.resourceKey=**/sdk/payin/form/PayInFormConfiguration.kt
sonar.issue.ignore.multicriteria.formEntryComposable.ruleKey=kotlin:S107
sonar.issue.ignore.multicriteria.formEntryComposable.resourceKey=**/sdk/payin/PayabliPayInForm.kt
sonar.issue.ignore.multicriteria.formContentComposables.ruleKey=kotlin:S107
sonar.issue.ignore.multicriteria.formContentComposables.resourceKey=**/sdk/payin/ui/**
sonar.issue.ignore.multicriteria.libraryManifestBackup.ruleKey=xml:S6358
sonar.issue.ignore.multicriteria.libraryManifestBackup.resourceKey=taptopay/src/main/AndroidManifest.xml

# Each module reads the reports CI produced and uploaded: ktlint, Android Lint and JaCoCo per module, and the
# compiled classes. Paths are relative to the module. A report that is absent is a warning, never a failure,
# so a module missing one is visible in the analysis log.
core.sonar.sources=src/main
core.sonar.tests=src/test,src/androidTest,src/sharedTest
core.sonar.java.binaries=build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes
core.sonar.kotlin.ktlint.reportPaths=build/reports/ktlint/ktlintKotlinScriptCheck/ktlintKotlinScriptCheck.xml,build/reports/ktlint/ktlintMainSourceSetCheck/ktlintMainSourceSetCheck.xml,build/reports/ktlint/ktlintTestSourceSetCheck/ktlintTestSourceSetCheck.xml,build/reports/ktlint/ktlintAndroidTestSourceSetCheck/ktlintAndroidTestSourceSetCheck.xml
core.sonar.androidLint.reportPaths=build/reports/lint-results-debug.xml
core.sonar.coverage.jacoco.xmlReportPaths=build/reports/coverage/test/debug/report.xml,build/reports/coverage/androidTest/debug/connected/report.xml

