# Keeps the pinned action references current.
#
# Every third-party action in every workflow is pinned to a commit, with its version in a trailing comment,
# and a pinned SHA is otherwise a string that ages silently: GitHub does not announce a new release to a
# workflow that names a commit. Dependabot is what turns that into a pull request. Verified against the shape
# used here rather than assumed: on `ossf/scorecard#5137` Dependabot rewrote `actions/setup-go@4b73464… #
# v6.3.0` to `@b7ad1da… # v7.0.0`, so it maintains the trailing version comment as well as the SHA, which is
# why that comment is written in the pinned form.
#
# Scoped to actions alone. Gradle dependencies are a separate question with a different blast radius, and
# adding them here would arrive as a surprise on a change about a workflow pin.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request rather than one per action, which is what `ossf/scorecard` does: its
    # "Bump the github-actions group across 1 directory with 9 updates" is the grouped form.
    groups:
      actions:
        patterns:
          - "*"
