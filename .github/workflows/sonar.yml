name: SonarCloud

# The analysis, out of reach of the code it analyses. A `pull_request` run uses the branch's copy of `ci.yml`,
# so a job there holding SONAR_TOKEN is one a branch can rewrite to print it. GitHub triggers `workflow_run`
# only for a workflow file on the default branch and runs that copy, so nothing here can be edited by the pull
# request it reports on, and no step builds or runs the tree: the scanner reads the sources and the reports
# and classes CI uploaded.
#
# A change to this file takes effect once it is on main, and cannot be exercised from a pull request.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  newest:
    name: Newest revision
    runs-on: ubuntu-latest
    # A failed run produces no reports worth reading. Same repository only: a fork's pull request has no entry
    # in `pull_requests`, so there is nothing trustworthy to decorate. Dependabot's pull requests skip the
    # card-present job, which has no credential for them, so their analysis would under-report :taptopay.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && !(github.event.workflow_run.event == 'pull_request'
           && github.event.workflow_run.actor.login == 'dependabot[bot]')
    # Outside the analysis's concurrency group, so a stale run is turned away before it can take the pending
    # place in it: GitHub keeps one pending job per group, and a later arrival replaces it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      # Only the newest revision of a pull request or branch is analysed. An older one's numbers would replace
      # the newer analysis on the server.
      - name: Check the revision is the newest
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$PR" ]; then
            number=$(printf '%s' "$PR" | grep -E '^[0-9]+$')
            tip=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)
          else
            head=$(printf '%s' "$HEAD_BRANCH" | grep -E '^[A-Za-z0-9._/-]+$')
            tip=$(gh api "repos/$REPO/branches/$head" --jq .commit.sha)
          fi
          if [ "$tip" = "$SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "not analysing $SHA: $tip is newer"
          fi

  sonar:
    name: SonarCloud
    needs: newest
    if: needs.newest.outputs.newest == 'true'
    # The analysis token is an environment secret, released only to a run on main, release/* or hotfix/*. A
    # `workflow_run` run is main's.
    environment: ci-protected
    runs-on: ubuntu-latest
    # One analysis at a time per pull request, or per branch for a push run. Nothing is cancelled: a stale run
    # would cancel the newer analysis, and the newest check runs again before the scan.
    concurrency:
      group: >-
        sonar-${{ github.event.workflow_run.pull_requests[0].number
          || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # The revision the triggering run tested, not main, which this workflow is read from. Analysis reads the
      # history to decide what is new. Checking the branch out is not running it: nothing here builds or
      # executes anything from the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Workspace-relative, so each restores into the module build trees `sonar-project.properties` reads.
      - name: Download the reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the card-present reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: card-present-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the instrumented coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: instrumented-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A missing report is a Sonar warning, not an error, so a broken hand-off would analyse cleanly and
      # report the device-covered lines as uncovered: a coverage regression with no cause.
      - name: Check the instrumented coverage arrived
        run: |
          for module in core payin; do
            report="$module/build/reports/coverage/androidTest/debug/connected/report.xml"
            if [ ! -s "$report" ]; then
              echo "::error::$report is missing or empty; the analysis would under-report $module"
              exit 1
            fi
          done

      # The scanner's configuration is main's, never the analysed revision's: a branch could set a property that
      # runs a binary of its own beside SONAR_TOKEN. `github.sha` is the main commit this workflow was read from.
      # Every copy in the workspace goes too, since the scanner also loads one from each module's directory.
      - name: Take the configuration from main
        env:
          MAIN_SHA: ${{ github.sha }}
        run: |
          git show "$MAIN_SHA:sonar-project.properties" > "$RUNNER_TEMP/sonar-project.properties"
          find . -name sonar-project.properties -not -path '*/.git/*' -delete

      # Where the analysis goes and which configuration it reads are forced here, and a property on the command
      # line wins over the file. The pull request is taken from the event, never from an artifact, and each ref
      # is checked rather than pasted.
      - name: Identify the pull request
        id: pr
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          PR_BASE: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          trusted="-Dsonar.host.url=https://sonarcloud.io"
          trusted="$trusted -Dsonar.organization=payabli"
          trusted="$trusted -Dsonar.projectKey=payabli_sdk-android"
          trusted="$trusted -Dproject.settings=$RUNNER_TEMP/sonar-project.properties"
          if [ -z "$PR" ]; then
            head=$(printf '%s' "$HEAD_BRANCH" | sed -nE '/^[A-Za-z0-9._/-]+$/p')
            if [ -z "$head" ]; then
              echo "::error::the triggering run named a branch this cannot use."
              exit 1
            fi
            echo "args=$trusted -Dsonar.branch.name=$head" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(printf '%s' "$PR" | sed -nE '/^[0-9]+$/p')
          branch=$(printf '%s' "$PR_BRANCH" | sed -nE '/^[A-Za-z0-9._/-]+$/p')
          base=$(printf '%s' "$PR_BASE" | sed -nE '/^[A-Za-z0-9._/-]+$/p')
          if [ -z "$number" ] || [ -z "$branch" ] || [ -z "$base" ]; then
            echo "::error::the triggering run named a pull request this cannot use."
            exit 1
          fi
          echo "args=$trusted -Dsonar.pullrequest.key=$number -Dsonar.pullrequest.branch=$branch -Dsonar.pullrequest.base=$base" >> "$GITHUB_OUTPUT"

      # Again, for a run overtaken while it waited in the group.
      - name: Check the revision is still the newest
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$PR" ]; then
            number=$(printf '%s' "$PR" | grep -E '^[0-9]+$')
            tip=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)
          else
            head=$(printf '%s' "$HEAD_BRANCH" | grep -E '^[A-Za-z0-9._/-]+$')
            tip=$(gh api "repos/$REPO/branches/$head" --jq .commit.sha)
          fi
          if [ "$tip" = "$SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "not analysing $SHA: $tip is newer"
          fi

      # Pinned to a commit: this step is handed SONAR_TOKEN.
      - name: Analyze
        if: steps.newest.outputs.newest == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.pr.outputs.args }}
