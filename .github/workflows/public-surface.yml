name: Public surface

# The signature gate, on the pull request and separate from CI: a release names a commit that passed
# CI on its release branch, so a gate inside CI is one a release depends on through CI. This workflow
# holds what a pull request owes, and the release workflow checks what it ships. The job needs no credential,
# because :core resolves nothing outside the project, so a fork's pull request gets the same signal.

on:
  pull_request:
    branches: [main, 'release/**', 'hotfix/**']

concurrency:
  group: public-surface-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never --info or --debug here: verbose Gradle logs can print repository credentials.
  GRADLE_OPTS: -Dorg.gradle.console=plain

# Naming bash is what turns `-o pipefail` on: an unset `shell:` runs `bash -e`, where a pipeline reports
# the last command's status. The step runs one command per line, so the same failure would surface
# either way, and the convention holds across every workflow in this repository.
defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Public surface
    runs-on: ubuntu-latest
    steps:
      # The record, the index and the working tree are all at HEAD, so a shallow clone carries all
      # the gate reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to a commit, as every third-party action in this repository is, and Dependabot keeps the pin
      # current: a tag runs whatever its owner points it at on the day, and a commit names one snapshot.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # The generated signature must match the checked-in file exactly: a declaration that became
      # public, or stopped being public, without core/api/release.txt being regenerated in the same
      # change fails the diff, naming the declaration. The record is deleted before regeneration, so
      # a generation that skips or writes anywhere else fails against the committed record rather
      # than passing on stale content. The ls-files guard catches the record being deleted from the
      # repository, which the diff cannot see. The dump records the SDK version constant, so a
      # version bump regenerates the file in the same change.
      - name: Public surface
        run: |
          rm core/api/release.txt
          ./gradlew :core:metalavaGenerateSignatureRelease
          git ls-files --error-unmatch core/api/release.txt
          git diff --exit-code -- core/api/release.txt
