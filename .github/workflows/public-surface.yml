name: Public surface

# The signature gate, on the pull request and separate from CI: a release names a commit that passed
# CI on its release branch, so a gate inside CI is one a release depends on through CI. This workflow
# holds what a pull request owes, and the release workflow checks what it ships. Every published module that
# declares code has a record. :core, :payin and :telemetry resolve nothing outside the project, so their job
# needs no credential and a fork's pull request gets the same signal. :taptopay compiles against the card
# reader, which resolves only with a login, so its record is checked in a job of its own that reads the
# credential from an environment, as ci.yml's card-present job does.

on:
  pull_request:
    branches: [main, 'release/**', 'hotfix/**']

concurrency:
  group: public-surface-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never --info or --debug here: verbose Gradle logs can print repository credentials.
  GRADLE_OPTS: -Dorg.gradle.console=plain

# Naming bash is what turns `-o pipefail` on: an unset `shell:` runs `bash -e`, where a pipeline reports
# the last command's status. The step runs one command per line, so the same failure would surface
# either way, and the convention holds across every workflow in this repository.
defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Public surface
    runs-on: ubuntu-latest
    steps:
      # The record, the index and the working tree are all at HEAD, so a shallow clone carries all
      # the gate reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to a commit, as every third-party action in this repository is, and Dependabot keeps the pin
      # current: a tag runs whatever its owner points it at on the day, and a commit names one snapshot.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # The generated signature must match each checked-in record exactly: a declaration that became
      # public, or stopped being public, without its module's api/release.txt being regenerated in the
      # same change fails the diff, naming the declaration. The records are deleted before regeneration,
      # so a generation that skips or writes anywhere else fails against the committed record rather
      # than passing on stale content. The ls-files guard catches a record being deleted from the
      # repository, which the diff cannot see. :core's dump records the SDK version constant, so a
      # version bump regenerates it in the same change.
      - name: Public surface
        run: |
          rm core/api/release.txt payin/api/release.txt telemetry/api/release.txt
          ./gradlew :core:metalavaGenerateSignatureRelease :payin:metalavaGenerateSignatureRelease :telemetry:metalavaGenerateSignatureRelease
          git ls-files --error-unmatch core/api/release.txt payin/api/release.txt telemetry/api/release.txt
          git diff --exit-code -- core/api/release.txt payin/api/release.txt telemetry/api/release.txt

  card-present:
    name: Public surface (card-present)
    runs-on: ubuntu-latest
    # The card reader credential is an environment secret: `ci-pull-request` on a pull request, `ci-protected` on
    # a push. Skipped where no credential can be had, a fork's pull request and Dependabot's, exactly as
    # ci.yml's card-present job is.
    environment: ${{ github.event_name == 'pull_request' && 'ci-pull-request' || 'ci-protected' }}
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
    env:
      PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
      PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # The same four commands over :taptopay's record.
      - name: Public surface
        run: |
          rm taptopay/api/release.txt
          ./gradlew :taptopay:metalavaGenerateSignatureRelease
          git ls-files --error-unmatch taptopay/api/release.txt
          git diff --exit-code -- taptopay/api/release.txt
