name: Source branch

# main holds only what has been released, so it takes pull requests from release and hotfix branches, and
# from Dependabot, whose bumps pass main's CI before they merge. A ruleset can require a check but cannot name
# a pull request's source branch, so this job is the mechanism. It reads the event and nothing in the
# repository, so it checks nothing out and holds no token.

on:
  pull_request:
    branches: [main]
    # `edited` as well, so a pull request retargeted to main is checked on the retarget.
    types: [opened, synchronize, reopened, edited]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Source branch
    runs-on: ubuntu-latest
    steps:
      # Through the environment, so a branch name is never parsed as shell.
      - name: Check the pull request comes from a release, hotfix or Dependabot branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/?*|hotfix/?*|dependabot/?*) ;;
            *)
              echo "::error::main takes pull requests from release/, hotfix/ and dependabot/ branches only, not '$HEAD_REF'."
              exit 1
              ;;
          esac
