name: Live flows (sandbox)

# One of two entry points into `live-flows.yml`, which carries the whole explanation. This file exists so qa
# and sandbox are separate runs with separate results rather than two jobs whose failures share a verdict.

on:
  workflow_dispatch:
  schedule:
    # 11:30 UTC, half an hour after the qa run so the two do not submit into both paypoints at once and a
    # runner is free for the second. UTC only, so it shifts against Pacific twice a year, as nightly.yml notes.
    - cron: '30 11 * * *'

concurrency:
  group: live-sandbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `bash` turns on pipefail, so a failure left of a `|` fails the step.
defaults:
  run:
    shell: bash

jobs:
  sandbox:
    uses: ./.github/workflows/live-flows.yml
    with:
      environment: sandbox
      secrets-suffix: SBX
    # By name, and only this run's own: a called workflow reads an environment secret only when its caller
    # passes it. live-flows.yml resolves each one from ci-protected.
    secrets:
      PAYABLI_CLIENT_ID_SBX: ${{ secrets.PAYABLI_CLIENT_ID_SBX }}
      PAYABLI_CLIENT_SECRET_SBX: ${{ secrets.PAYABLI_CLIENT_SECRET_SBX }}
      PAYABLI_ENTRY_SBX: ${{ secrets.PAYABLI_ENTRY_SBX }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
