name: Secret visibility probe

# TEMPORARY, DELETE ONCE ANSWERED.
#
# Settles one question: do the organization secrets this repository's CI needs
# actually reach it? Runs on pull request AND on push to main, so the same probe
# answers both "does a PR branch see them" and "does merging change anything".
#
# Prints presence only, never a value. Secrets are masked in logs regardless, but
# there is no reason to send one to the log in the first place. Length is not
# printed either: it is a small leak for no benefit.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      # Control: this one is expected to be absent, so a run where everything
      # reports "set" would mean the probe itself is broken.
      DEFINITELY_NOT_A_SECRET: ${{ secrets.DEFINITELY_NOT_A_SECRET }}
    steps:
      - name: Report which secrets resolved
        run: |
          echo "event:      ${{ github.event_name }}"
          echo "ref:        ${{ github.ref }}"
          echo "repository: ${{ github.repository }} (visibility matters: org secrets"
          echo "            scoped to 'Private and internal repositories' never reach a public repo)"
          echo ""
          report() {
            if [ -n "$2" ]; then echo "  $1: SET"; else echo "  $1: EMPTY"; fi
          }
          report SONAR_TOKEN              "$SONAR_TOKEN"
          report GPR_USER                 "$GPR_USER"
          report GPR_TOKEN                "$GPR_TOKEN"
          report DEFINITELY_NOT_A_SECRET  "$DEFINITELY_NOT_A_SECRET"
