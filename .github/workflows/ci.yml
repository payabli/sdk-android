name: CI

on:
  push:
    branches: [main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, 'release/**', 'hotfix/**']

concurrency:
  # A pull request's runs share a group and the newest replaces the rest. A push run is a group of its own: a
  # release names a commit that passed this workflow on a push to its release or hotfix branch, and a group
  # holds one waiting run, which another push would replace before it ever ran. One commit pushed to main
  # and to a new release branch is two pushes, so not even the commit can be shared.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Never --info or --debug here: verbose Gradle logs can print repository credentials.
  GRADLE_OPTS: -Dorg.gradle.console=plain

# Naming bash is what turns `-o pipefail` on: an unset `shell:` runs `bash -e`, where a pipeline reports
# the last command's status and `./gradlew test | tee log` is green after a red suite. A release names a
# commit that passed this workflow, so a suite masked here is released.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so analysis can attribute new code.
          fetch-depth: 0
          # A pull request builds its head, not GitHub's merge commit: Sonar is handed only the head, and the
          # classes and coverage it reads have to come from the tree it analyses.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to a commit, as every third-party action in this repository is, and Dependabot keeps the pin
      # current: a tag runs whatever its owner points it at on the day, and a commit names one snapshot.
      # A job-level secret is readable by everything that runs in the job, so in card-present one tag
      # among the pins would be the whole exposure back.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 moved caching into `gradle-actions-caching`, which is proprietary and not covered by the
          # MIT licence: its release note says upgrading to the default `enhanced` provider accepts a
          # separate Terms of Use. `basic` is the open-source implementation over the GitHub Actions
          # cache, which is what v5 did, and the component is not loaded when it is not selected.
          #
          # Chosen so nobody has to agree to a third party's terms on the organisation's behalf for a
          # public repository. `enhanced` may well be faster; that has not been measured here, and it is
          # a licensing decision rather than a build one.
          cache-provider: basic

      # :taptopay needs a credential fork PRs cannot have; see the card-present job. :example's `cardPresent`
      # variant is there too, because it links :taptopay for the Tap to pay screen and so resolves the card
      # reader as well. Its `cardNotPresent` variant links no reader, so it builds here with the walkthrough's
      # test APK, proving the live run's build needs no credential. :payabli-android re-exports :taptopay, so
      # it resolves the reader too.
      - name: Build
        run: ./gradlew :core:assembleDebug :payin:assembleDebug :telemetry:assembleDebug
          :testutils:assembleDebug :example:assembleCardNotPresentDebug
          :example:assembleCardNotPresentDebugAndroidTest

      # The public-surface gate runs in its own workflow, on the pull request: a release names a
      # commit that passed this workflow on its release branch, so a gate inside it is one a release
      # depends on through CI.

      - name: Unit tests
        run: ./gradlew :core:test :payin:test :telemetry:test :testutils:test
          :example:testCardNotPresentDebugUnitTest

      # build-logic is an included build, so no task in the main build reaches its tests.
      - name: Convention plugin tests
        run: ./gradlew -p build-logic test

      - name: Format
        run: ./gradlew :core:ktlintCheck :payin:ktlintCheck :telemetry:ktlintCheck
          :payabli-bom:ktlintCheck :testutils:ktlintCheck :example:ktlintCheck

      - name: Android Lint
        run: ./gradlew :core:lint :payin:lint :telemetry:lint :testutils:lint
          :example:lintCardNotPresentDebug

      # The aggregate module has no tests, so no coverage task.
      #
      # --stacktrace because this step has failed with "Unable to generate Jacoco report" and
      # nothing else: a different module each time, passing on a re-run of the same commit, and
      # never reproducing locally. Gradle prints the cause only when asked. It is not in the class
      # the GRADLE_OPTS note warns about, which is --info and --debug printing repository
      # credentials.
      #
      # The cause, captured on two runs since:
      #
      #   Caused by: java.lang.ExceptionInInitializerError
      #   Caused by: java.lang.IllegalStateException: zip file closed
      #       at com.android.Version.<clinit>(Version.java:38)
      #       at java.util.zip.ZipFile.ensureOpen <- JarURLConnection.getInputStream
      #
      # A report worker initialises a class whose jar handle has already been closed. That accounts
      # for every property above: which module fails is whichever worker draws the stale handle, a
      # re-run gets fresh workers, and a warm local daemon holds its handles open. So it is a worker
      # and classloader lifetime problem rather than anything about the coverage data.
      #
      # --max-workers=1 is the mitigation, and it is a hypothesis rather than a proven fix: four
      # report tasks ran concurrently, each in a worker drawing from a shared classloader cache, and
      # serialising them removes the race the evidence describes. It is one flag rather than four
      # separate invocations because a second invocation would reuse the same daemon and could keep
      # the same cache.
      #
      # Cost, measured on the four-module step with every task re-run and all 940 tests running: 9 and 11
      # seconds unserialised against 16 and 17. Across a whole ci.yml run it does not separate from
      # run-to-run noise, 491 to 558 seconds with the flag against 458 to 580 before it, because the step
      # here builds one module.
      #
      # **Every invocation that runs a coverage task carries this flag**, here, in the card-present
      # job, and in nightly.yml. A mitigation on one leaves the same race reachable from the others, which
      # is where the first version of this left it. When adding a coverage task anywhere, add the flag with it.
      #
      # What would falsify it: this failing again with --max-workers=1 in effect. Then the sharing is
      # not between concurrent workers and the next thing to try is --no-daemon for this step alone.
      # Do not remove the flag without that evidence; the failure is intermittent, so a green run
      # after removing it proves nothing.
      - name: Coverage
        run: ./gradlew --stacktrace --max-workers=1
          :core:createDebugUnitTestCoverageReport
          :payin:createDebugUnitTestCoverageReport
          :telemetry:createDebugUnitTestCoverageReport
          :testutils:createDebugUnitTestCoverageReport

      # What `sonar.yml` reads, besides the instrumented coverage: every module's ktlint, Lint and JaCoCo
      # reports and its compiled classes. Relative to the workspace, so the download restores them where
      # `sonar-project.properties` looks.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes/**
          retention-days: 7

  instrumented:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    # No `if:` here, unlike the two jobs below. Those are gated because they need secrets a fork's pull
    # request never receives, so they report skipped rather than dying on an auth error. This job needs
    # none: :core and :payin resolve nothing outside the project. So it runs for everyone, and a fork gets
    # the instrumented signal that until now no pull request got at all.
    #
    # It also holds no credential for the third-party emulator action to reach, which is what allows that
    # action here at all. nightly.yml's header has the full argument; the short version is that
    # step-scoping a secret does not isolate it from code that ran earlier in the same job, so the only
    # way the action cannot reach a token is for the token to live in another job. The analysis runs in
    # `sonar.yml`, from main's copy, which is why the coverage this job produces reaches it as an artifact.
    #
    # :taptopay is absent for that same reason and not because of hardware: building it resolves the card
    # reader from a credentialed repository, so including it would hand that credential to this action.
    # :example is absent for a different one: the analysis skips that project outright, so its coverage is
    # read by nothing. Both are stated in taptopay/build.gradle.kts and build.gradle.kts respectively.
    timeout-minutes: 45
    env:
      # One place for the image coordinates, because the AVD cache key has to agree with the two emulator
      # steps below or the cache silently never hits. Same image the nightly runs, deliberately: two
      # instrumented runs disagreeing about the platform is a difference nobody would look for.
      API_LEVEL: '34'
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in this file.
          cache-provider: basic

      # Required on ubuntu-latest, and the step most often left out. Without it the emulator runs
      # unaccelerated, which is the one condition that makes the call-budget assertion flaky.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}

      # Cache miss only. Boots once to write a snapshot the test step then reuses.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests and coverage
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          # -no-snapshot-save so this run reuses the cached snapshot and does not rewrite it.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The coverage task runs the connected tests itself, so this is not connectedAndroidTest with a
          # report step after it. The runner arguments still apply either way: they are project properties,
          # not task arguments.
          #
          # notAnnotation excludes both manual tiers and names both annotations, because an androidTest
          # source set is not visible to another module's: :payin declares its own rather than referencing
          # :core's, so naming one would leave the other module's manual tier running. The argument takes a
          # comma-separated list. What it marks is "this job cannot answer the question" — an emulator's
          # Keystore is software-backed, and :payin's live flow needs client credentials no repository
          # holds.
          #
          # No notClass here, deliberately. A -P runner argument replaces the DSL's value for the key it
          # names, and payin/build.gradle.kts uses notClass to exclude the live tier whenever its
          # credentials are absent, which is always here. Passing one would overwrite that list and send
          # real payments from this step. notAnnotation is a different key, which is why the two coexist.
          #
          # --continue because the two modules are independent, and Gradle otherwise stops at the first
          # failure, leaving whether the second ran down to how the two happened to be scheduled.
          #
          # payabli.instrumentedCoverage is what turns the instrumentation on at all; it is off by default
          # because AGP instruments the debug build type, which is the variant :example links, and that put
          # JaCoCo through the sample's dex merge until it ran out of heap. This job builds no application
          # module, so it is the one place the cost is paid. build-logic carries the full reasoning.
          script: ./gradlew --continue --max-workers=1 -Ppayabli.instrumentedCoverage=true
            :core:createDebugAndroidTestCoverageReport
            :payin:createDebugAndroidTestCoverageReport
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.payabli.sdk.core.ManualDeviceTest,com.payabli.sdk.payin.ManualDeviceTest

      # What `sonar.yml` reads. Paths are kept relative to the workspace so the download restores them
      # into the module build trees the analysis already looks in, rather than somewhere it has to be
      # pointed at separately.
      - name: Upload instrumented coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-coverage
          path: '*/build/reports/coverage/androidTest/**'
          retention-days: 7
          # A silent empty artifact here becomes an unmeasured module in the analysis, which reads as a
          # coverage drop with no cause. Fail where the cause is still visible.
          if-no-files-found: error

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-results
          path: '*/build/reports/androidTests/**'
          retention-days: 7

  card-present:
    name: Build & Test (card-present)
    runs-on: ubuntu-latest
    # The card reader credential is an environment secret: `ci-pull-request` on a pull request, `ci-protected` on
    # a push to main, release/* or hotfix/*.
    environment: ${{ github.event_name == 'pull_request' && 'ci-pull-request' || 'ci-protected' }}
    # Skipped wherever the run has no secrets to build :taptopay with, so it reports skipped rather than
    # dying on an auth error. Two such runs, and GitHub decides both: a fork's pull request never receives
    # secrets at all, and a Dependabot pull request reads a separate secret store this repository does not
    # populate. Measured on #57, where the card reader resolved as `401 Unauthorized`.
    #
    # The Dependabot half is deliberately inside the pull-request clause. A push to a protected branch runs
    # this job whoever pushed it, including a merge auto-completed on Dependabot's behalf, and that push is
    # where a bumped action is actually tested against :taptopay.
    #
    # Giving Dependabot the credential instead was considered and rejected. Its `github_actions` ecosystem
    # edits workflow files, and a pull_request run uses the workflow from the head, so the run would execute
    # an unreviewed action version with a package credential available. Verified on #57: the log reads
    # `Download action repository 'gradle/actions@v6'`, the version the branch introduces.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
    env:
      PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
      PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in this file.
          cache-provider: basic

      # Release as well as debug, because the release variant is the artifact the card reader vendor
      # signs and it resolves a source set debug never compiles. A break there is invisible to every
      # other job: main has no release variant at all, and this branch found one the day it enabled it.
      - name: Build
        run: ./gradlew :taptopay:assembleDebug :payabli-android:assembleDebug
          :example:assembleDebug :example:assembleRelease

      - name: Unit tests
        run: ./gradlew :taptopay:test :example:test

      # `test` and `lint` do not compile `src/androidTest`, so a change to a shared type can leave every
      # instrumented source set uncompilable while all of the above pass. This needs no device, and it is
      # the only job that can do it for these two: `:taptopay` resolves the card reader from a private
      # registry, and `:example` links it.
      - name: Compile instrumented tests
        run: ./gradlew :taptopay:assembleAndroidTest :example:assembleAndroidTest

      - name: Format
        run: ./gradlew :taptopay:ktlintCheck :payabli-android:ktlintCheck

      - name: Android Lint
        run: ./gradlew :taptopay:lint :payabli-android:lint :example:lintCardPresentDebug

      - name: Coverage
        run: ./gradlew --max-workers=1 :taptopay:createDebugUnitTestCoverageReport
          :example:createCardPresentDebugUnitTestCoverageReport

      # The card-present modules' reports and classes, for `sonar.yml`, as the build job uploads its own.
      - name: Upload card-present reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: card-present-reports
          path: |
            taptopay/build/reports/**
            taptopay/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes/**
            payabli-android/build/reports/**
          retention-days: 7
