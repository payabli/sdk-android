name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never raise this to --info or --debug: verbose Gradle logs can print repository
  # credentials, and this repository is public.
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so analysis can attribute new code correctly.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # :taptopay is excluded here: it needs a credential the fork case cannot have.
      # It is covered by the card-present job below.
      - name: Build
        run: ./gradlew :core:assembleDebug :payin:assembleDebug :telemetry:assembleDebug
          :payabli-android:assembleDebug :example:assembleDebug

      - name: Unit tests
        run: ./gradlew :core:test :payin:test :telemetry:test :example:test

      - name: Format
        run: ./gradlew :core:ktlintCheck :payin:ktlintCheck :telemetry:ktlintCheck
          :payabli-android:ktlintCheck :payabli-bom:ktlintCheck :example:ktlintCheck

      - name: Android Lint
        run: ./gradlew :core:lint :payin:lint :telemetry:lint :payabli-android:lint :example:lint

      # The aggregate module has no tests of its own, so it has no coverage task.
      - name: Coverage
        run: ./gradlew :core:createDebugUnitTestCoverageReport
          :payin:createDebugUnitTestCoverageReport
          :telemetry:createDebugUnitTestCoverageReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/**'
          retention-days: 7

  card-present:
    name: Build & Test (card-present)
    runs-on: ubuntu-latest
    # Pull requests from forks never receive secrets, so this job is skipped there
    # rather than failing on an authentication error the contributor cannot fix.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :taptopay:assembleDebug

      - name: Unit tests
        run: ./gradlew :taptopay:test

      - name: Format
        run: ./gradlew :taptopay:ktlintCheck

      - name: Android Lint
        run: ./gradlew :taptopay:lint

      - name: Coverage
        run: ./gradlew :taptopay:createDebugUnitTestCoverageReport

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Analysis reads the reports these tasks emit, so they run first.
      - name: Produce reports
        run: ./gradlew ktlintCheck lint createDebugUnitTestCoverageReport

      - name: Analyze
        run: ./gradlew sonar
