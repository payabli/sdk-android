name: Nightly reporter tests

# `nightly_report.py` decides the nightly verdict and gates the run, and `nightly_slack.py` is the only
# thing that reports a failure. They are covered here rather than trusted.
#
# The same harness asserts three properties of the live workflows, which hold a client credential: no
# pull_request trigger, so a fork's pull request cannot reach the secrets; the credential reaching exactly one
# step, and not the one that runs a third-party action or the tests; and nothing passing it as a Gradle
# argument. Each was true of how those files were written, which is not the same as being enforced.
#
# It also gives a change to those scripts somewhere cheap to be checked. A scheduled run never fires from a
# feature branch. A dispatch can be pointed at one, since `nightly.yml` is on the default branch, but that
# runs the whole nightly including the emulator suite and its report job posts to the team channel, which is
# a great deal of machinery and noise for a change to a Python script. So the practical options were a
# short-lived probe branch with a temporary push trigger, or merging and waiting for morning. These run on
# the pull request itself, in about a minute, and post nothing.
#
# Path-filtered, so an ordinary pull request pays nothing for it. That also means it must not be made a
# required check: a required check that never runs blocks a merge rather than passing it. Neither is
# `nightly.yml`.
#
# No `setup-python` and nothing third-party. The runner's `python3` is what `nightly.yml` already invokes
# these scripts with, and the harness is standard library only, deliberately. `git` is needed and present,
# because the collector half builds a synthetic repository to run against.

on:
  pull_request:
    paths:
      # The workflow file is in the filter so a change to it tests itself.
      - '.github/scripts/**'
      - '.github/workflows/scripts.yml'
      # The harness also asserts properties of the live workflows: no pull_request trigger, and the client
      # credential reaching one step that is not the one running the emulator or the tests. Those files have
      # to be in the filter or the assertions would not run on the change that broke them.
      - '.github/workflows/live-*.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts.yml'
      - '.github/workflows/live-*.yml'

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    # The sabotage half runs deliberately corrupted copies of the reporter, and neither it nor the collector
    # subprocesses impose a timeout of their own, so a mutation that produces a loop would otherwise sit on
    # the six-hour default. The documented run is about a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 369 checks. The collector runs as a subprocess in a synthetic git repository; the poster runs
      # in-process against a fake Slack on loopback.
      - name: Verify
        run: python3 .github/scripts/tests/verify.py

      # 38 deliberate breaks, each confirmed to turn a check red. Rewrites copies in a scratch directory and
      # never the files in the tree, so an interrupted run leaves nothing behind. An edit that moves a
      # mutation anchor reports INVALID and fails here; re-point the anchor in the same change.
      - name: Sabotage
        run: python3 .github/scripts/tests/sabotage.py
