name: Release

# Publishes a release of every module to /maven, where a key is written once and never replaced, then
# opens a GitHub Release at the tag carrying notes and no assets. The artifacts are resolved from the Maven
# origin only.
#
# Dispatched from main, and in two runs. The run on main checks that CI passed for the commit and reads
# `payabli.version`. Then a job in the `release` environment, the only job holding the deploy key the tag
# ruleset admits, creates the tag and dispatches this workflow on it. The run on the tag builds, uploads and
# writes the notes, because the role that writes /maven trusts a tag ref and nothing else. No person creates
# a release tag.

on:
  workflow_dispatch:

permissions:
  contents: read

# See the note in qa-snapshot.yml: naming bash is what turns `-o pipefail` on.
defaults:
  run:
    shell: bash

jobs:
  # Run on main. Reads the commit and the property, and holds nothing that can tag or publish.
  check:
    name: Check the commit can be released
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the CI runs for this commit.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The tag run executes the unit tier only. CI on main is what ran the instrumented tests, lint and
      # formatting, so a release names a commit that passed it there or nothing is tagged.
      - name: Check CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push \
            --branch main --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on main for $SHA. Dispatch once CI on main has passed."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A release version and nothing else. A candidate carries a qualifier and belongs on the mutable
      # channel; the role the tag run assumes would write it where it can never be replaced.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^payabli.version=//p' gradle.properties)
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $release ]]; then
            echo "::error::payabli.version is '$version', which is not <major>.<minor>.<patch>."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The approval. Its required reviewers are who may release, it deploys from main only, and it is the only
  # job that can read the deploy key. It runs no file from the checkout.
  tag:
    name: Tag the release
    needs: [check]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # To dispatch the tag run.
      actions: write
    steps:
      - name: Check the release key is provisioned
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::the release environment has no RELEASE_DEPLOY_KEY secret"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag already on this commit is a resumed release and is not pushed twice. One on another commit is
      # a number already spent.
      - name: Create the tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=
          if [ -n "$(git tag --list "$VERSION")" ]; then
            tagged=$(git rev-parse "refs/tags/$VERSION^{commit}")
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::tag $VERSION already names $tagged, not $GITHUB_SHA. Take the next version."
            exit 1
          fi
          if [ -z "$tagged" ]; then
            # GitHub's host keys come from its API over HTTPS, so the SSH connection is verified rather
            # than trusted on first use.
            umask 077
            key="$RUNNER_TEMP/release-key"
            hosts="$RUNNER_TEMP/github-known-hosts"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key"
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Payabli Android SDK $VERSION, dispatched by $GITHUB_TRIGGERING_ACTOR" "$GITHUB_SHA"
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$VERSION"
          fi

      # A dispatch always creates a run, including one started with this job's token, and a run on the tag
      # presents the subject the release role trusts.
      - name: Start the tag run
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION"

  # Gradle, the suites and the card reader credential, and no identity that can write the origin. The
  # upload runs on a fresh runner, so nothing a build script or a dependency leaves behind runs beside
  # the token.
  build:
    name: Build the release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the CI runs for this commit.
      actions: read
    steps:
      # Asked again here, because anyone who can dispatch can dispatch on an existing tag.
      - name: Check CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push \
            --branch main --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on main for $SHA."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag names the committed version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Empty rather than a failed grep when the line is missing, so the refusal below says why.
          version=$(sed -n 's/^payabli.version=//p' gradle.properties)
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag '$TAG' does not match payabli.version '$version' in gradle.properties."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # A tag answers to no CI run, so the suites run here. build-logic is an included build and takes its
      # own invocation.
      - name: Unit tests
        env:
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: |
          ./gradlew :core:test :payin:test :telemetry:test :testutils:test :taptopay:test :example:test
          ./gradlew -p build-logic test

      # No version override: the check above is what makes the committed property the tag.
      - name: Publish to the staging directory
        env:
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: ./gradlew publish

      # Kept for as long as GitHub allows. A rebuild produces different bytes, so this tree is the only
      # one a half-finished upload can be completed from.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-repo
          path: build/staging-repo
          if-no-files-found: error
          retention-days: 90

  upload:
    name: Upload to /maven
    needs: [build]
    # One release upload at a time, and a running one is never cancelled: the keys it has written stay
    # written. GitHub holds one pending run per group, so a third tag queued behind two replaces the
    # second, which then shows as cancelled and is re-run.
    concurrency:
      group: maven-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # For the uploader alone. No toolchain and no Gradle run in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Derived again rather than handed over by the build, so the version uploaded is read from the
      # tagged commit by the job that writes it.
      - name: Check the tag names the committed version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Empty rather than a failed grep when the line is missing, so the refusal below says why.
          version=$(sed -n 's/^payabli.version=//p' gradle.properties)
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag '$TAG' does not match payabli.version '$version' in gradle.properties."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Variables rather than secrets: masking a role ARN makes every AccessDenied unreadable.
      - name: Check the channel is provisioned
        run: |
          missing=
          [ -n "$AWS_RELEASE_PUBLISH_ROLE_ARN" ] || missing="$missing AWS_RELEASE_PUBLISH_ROLE_ARN"
          [ -n "$AWS_SDK_CDN_BUCKET" ] || missing="$missing AWS_SDK_CDN_BUCKET"
          [ -n "$AWS_SDK_CDN_REGION" ] || missing="$missing AWS_SDK_CDN_REGION"
          if [ -n "$missing" ]; then
            echo "::error::unset repository variable(s):$missing"
            exit 1
          fi
        env:
          AWS_RELEASE_PUBLISH_ROLE_ARN: ${{ vars.AWS_RELEASE_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
          AWS_SDK_CDN_REGION: ${{ vars.AWS_SDK_CDN_REGION }}

      # The same check as qa-snapshot.yml, in the tag form this role trusts.
      - name: Check the OIDC subject the trust policies expect
        env:
          EXPECTED: repo:payabli@139794672/sdk-android@1311286517:ref:refs/tags/
        run: |
          claims=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; print(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)).decode())')
          sub=$(printf '%s' "$claims" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sub"])')
          echo "subject presented: $sub"
          case "$sub" in
            "$EXPECTED"*) ;;
            *)
              echo "::error::this run presents '$sub', and the release role grants '$EXPECTED*'."
              echo "::error::GitHub's immutable subject claim setting for this repository may have moved."
              echo "::error::The trust policies are Terraform in payabli/infrastructure, frontend/cdn/oidc.tf."
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staging-repo
          path: build/staging-repo

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_SDK_CDN_REGION }}

      # The release role writes /maven and nothing else. Asked before the upload, so a role that could also
      # write the QA prefix publishes nothing. An allowed write lands an empty key on the mutable prefix.
      - name: Check the role is refused on the QA prefix
        env:
          ROLE_ARN: ${{ vars.AWS_RELEASE_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
        run: |
          python3 -c '
          import os, subprocess, sys
          account = os.environ["ROLE_ARN"].split(":")[4]
          r = subprocess.run(
              ["aws", "s3api", "put-object", "--bucket", os.environ["AWS_SDK_CDN_BUCKET"],
               "--key", "maven-qa/com/payabli/.release-role-probe", "--body", "/dev/null",
               "--if-none-match", "*", "--expected-bucket-owner", account],
              capture_output=True, text=True)
          denied = r.returncode != 0 and "AccessDenied" in r.stderr
          print("refused on maven-qa/, as it should be" if denied
                else "::error::expected AccessDenied on maven-qa/, got: " + (r.stderr.strip() or "a successful write"))
          sys.exit(0 if denied else 1)
          '

      # The account comes off the role ARN, so there is one copy of it. Re-running this job against the
      # same build reports every key already written as present. A rebuild does not: its bytes differ,
      # and the uploader refuses a key that holds different ones.
      - name: Upload the staging tree
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ROLE_ARN: ${{ vars.AWS_RELEASE_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
        run: |
          AWS_SDK_CDN_ACCOUNT=$(echo "$ROLE_ARN" | cut -d: -f5)
          export AWS_SDK_CDN_ACCOUNT
          python3 .github/scripts/publish_staging.py --prefix maven --version "$VERSION"

  # Notes only. The binary is at the Maven origin, and a release asset cannot front a Maven layout.
  release-notes:
    name: Create the GitHub Release
    needs: [upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A re-run of a tag whose release already exists leaves it as it is.
      - name: Create the release at the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq ".[] | select(.tagName == \"$TAG\") | .tagName")
          if [ -n "$existing" ]; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
