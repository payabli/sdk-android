name: Release

# Publishes a release of every module to /maven, where a key is written once and never replaced, then
# opens a GitHub Release at the tag carrying notes and no assets. The artifacts are resolved from the Maven
# origin only.
#
# Dispatched from main, naming the commit to release, in one run. The commit is on the release or hotfix
# branch of the version it declares and passed CI there. The check reads the commit and its
# `payabli.version`, the suites and the build run side by side at that commit, and then one job in the
# `release` environment tags, uploads and writes the notes. Each is its own job so that "Re-run failed
# jobs" repeats only what failed. That job is the approval, the only holder of the deploy
# key the tag ruleset admits, and the subject the role that writes /maven trusts. No person creates a
# release tag.

on:
  workflow_dispatch:
    inputs:
      # Named rather than taken from a branch's head, so a merge landing between the decision and the
      # dispatch is not what gets released.
      commit:
        description: "Full 40-character SHA of the commit to release, on release/<version> or hotfix/<version>"
        required: true
        type: string
      release_notes:
        description: "Release notes (markdown), published as the release body"
        required: true
        type: string

permissions:
  contents: read

# Naming bash is what turns `-o pipefail` on: an unset `shell:` runs `bash -e`, where a pipeline reports
# the last command's status and the failure of anything left of a `|` is dropped.
defaults:
  run:
    shell: bash

jobs:
  # Reads the commit and the property, and holds nothing that can tag or publish.
  check:
    name: Check the commit can be released
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the CI runs for this commit.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ inputs.commit }}
    steps:
      # Notes are written for the release, because pull request titles carry tracker references no release
      # page should name. Checked here, so a blank body stops the run before anything is tagged.
      - name: Check the release notes are written
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -z "${RELEASE_NOTES//[[:space:]]/}" ]; then
            echo "::error::release_notes is blank, and a release is published with notes written for it."
            exit 1
          fi

      # A full SHA and nothing shorter, so the commit approved is not a prefix that resolves to another.
      - name: Check the commit is named in full
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::a release names the full 40-character commit SHA, not '$COMMIT'."
            exit 1
          fi

      # All of history, so the checks below can see every branch and every tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      # A release version and nothing else. A candidate carries a qualifier and belongs on the mutable
      # channel; the release role would write it where it can never be replaced.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^payabli.version=//p' gradle.properties)
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $release ]]; then
            echo "::error::payabli.version is '$version', which is not <major>.<minor>.<patch>."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # On the run's page, so the approver sees what the approval releases.
          {
            echo "Releasing \`$version\` from \`$(git rev-parse HEAD)\`:"
            echo
            echo "> $(git log -1 --format=%s HEAD)"
            echo
            echo "The workflow and its uploader run from \`$GITHUB_SHA\` on main."
          } >> "$GITHUB_STEP_SUMMARY"

      # The branch is named by the version the commit declares, so a commit on another version's branch, or
      # only on main, is refused rather than released under a number it was not worked as.
      - name: Check the commit is on its release or hotfix branch
        id: branch
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch=
          for candidate in "release/$VERSION" "hotfix/$VERSION"; do
            # for-each-ref matches a prefix, so release/0.2.0 would also find release/0.2.0/x. Exact name only.
            tip=$(git for-each-ref --format='%(refname) %(objectname)' "refs/remotes/origin/$candidate" |
              awk -v ref="refs/remotes/origin/$candidate" '$1 == ref { print $2 }')
            if [ -n "$tip" ] && [ "$(git merge-base "$COMMIT" "$tip")" = "$COMMIT" ]; then
              branch=$candidate
              break
            fi
          done
          if [ -z "$branch" ]; then
            echo "::error::$COMMIT is not on release/$VERSION or hotfix/$VERSION, the branches of the version it declares."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The build runs the unit tier only. CI on the branch is what ran the instrumented tests, lint and
      # formatting, so a release names a commit that passed it there or nothing is tagged.
      - name: Check CI passed on the branch for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push \
            --branch "$BRANCH" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on $BRANCH for $SHA. Dispatch once CI on $BRANCH has passed."
            exit 1
          fi

      # A version below the newest release would be published after it.
      - name: Check the version is not below the newest release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          newest=$(git for-each-ref --format='%(refname:strip=2)' refs/tags | sed -nE "/$release/p" | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::the newest release is $newest, and $VERSION is lower."
            exit 1
          fi

      # Every earlier release is merged back into main, and main into this release's branch, before the next
      # is cut: main then holds each tagged commit, and the commit released carries every earlier fix.
      - name: Check every earlier release is in main and in the commit
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for tag in $(git for-each-ref --format='%(refname:strip=2)' refs/tags | sed -nE "/$release/p"); do
            tagged=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tag" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$tag" "$VERSION" | sort -V | head -n 1)" = "$tag" ]; then
              if [ "$(git merge-base "$tagged" refs/remotes/origin/main)" != "$tagged" ]; then
                echo "::error::release $tag is not in main: its release or hotfix branch has not merged back with a merge commit."
                exit 1
              fi
              if [ "$(git merge-base "$tagged" "$COMMIT")" != "$tagged" ]; then
                echo "::error::release $tag is not in $COMMIT: merge main into the branch and pass CI there before cutting $VERSION."
                exit 1
              fi
            fi
          done

  # The suites, on their own so a flaky one is re-run without rebuilding. Gradle and the card reader
  # credential, and no identity that can tag or write the origin.
  test:
    name: Test the release
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # build-logic is an included build and takes its own invocation.
      - name: Unit tests
        env:
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: |
          ./gradlew :core:test :payin:test :telemetry:test :testutils:test :taptopay:test :example:test
          ./gradlew -p build-logic test

  # The staging tree, beside the suites rather than after them, and on its own so a packaging failure is
  # re-run without the suites. Before the approval, so a build that fails spends no version number, and on
  # its own runner, so nothing a build script or a dependency leaves behind runs beside the deploy key or
  # the publishing token.
  build:
    name: Build the release
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      # The build's Gradle carries no override, so the committed property is what it publishes.
      - name: Check the commit carries the version the check read
        env:
          CHECKED: ${{ needs.check.outputs.version }}
        run: |
          # Empty rather than a failed grep when the line is missing, so the refusal below says why.
          version=$(sed -n 's/^payabli.version=//p' gradle.properties)
          if [ "$CHECKED" != "$version" ]; then
            echo "::error::payabli.version is '$version' here, and the check read '$CHECKED'."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # The release checks what it ships: the signature of the release build must match the committed
      # record, so a record corrupted on the release commit, or a surface that drifted without the
      # record, refuses the publish before a version number is spent. Nothing else in the build reads
      # the signature: assembling and publishing work with the plugin absent.
      - name: Public surface
        run: |
          rm core/api/release.txt
          ./gradlew :core:metalavaGenerateSignatureRelease
          git ls-files --error-unmatch core/api/release.txt
          git diff --exit-code -- core/api/release.txt

      - name: Publish to the staging directory
        env:
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: ./gradlew publish

      # Kept for as long as GitHub allows. A rebuild produces different bytes, so this tree is the only
      # one a half-finished upload can be completed from, by re-running the failed job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-repo
          path: build/staging-repo
          if-no-files-found: error
          retention-days: 90

  # The approval. Its required reviewers are who may release and it deploys from main only. It runs no
  # Gradle and sets up no toolchain, so the only code beside the deploy key and the publishing token is
  # this workflow's own.
  release:
    name: Tag, upload and write the release
    needs: [check, test, build]
    runs-on: ubuntu-latest
    environment: release
    # One release at a time, and a running one is never cancelled: the keys it has written stay written.
    # GitHub holds one pending run per group, so a third release queued behind two replaces the second,
    # which then shows as cancelled and is re-run.
    concurrency:
      group: maven-release
      cancel-in-progress: false
    permissions:
      # For the GitHub Release. The tag ruleset admits the deploy key alone, so this token cannot create
      # or move a tag.
      contents: write
      # For the OIDC role that writes /maven.
      id-token: write
    steps:
      # Every check that needs no tag comes first, so a missing setting fails before a number is spent.
      - name: Check the release key is provisioned
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::the release environment has no RELEASE_DEPLOY_KEY secret"
            exit 1
          fi

      # Variables rather than secrets: masking a role ARN makes every AccessDenied unreadable.
      - name: Check the channel is provisioned
        run: |
          missing=
          [ -n "$AWS_RELEASE_PUBLISH_ROLE_ARN" ] || missing="$missing AWS_RELEASE_PUBLISH_ROLE_ARN"
          [ -n "$AWS_SDK_CDN_BUCKET" ] || missing="$missing AWS_SDK_CDN_BUCKET"
          [ -n "$AWS_SDK_CDN_REGION" ] || missing="$missing AWS_SDK_CDN_REGION"
          if [ -n "$missing" ]; then
            echo "::error::unset repository variable(s):$missing"
            exit 1
          fi
        env:
          AWS_RELEASE_PUBLISH_ROLE_ARN: ${{ vars.AWS_RELEASE_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
          AWS_SDK_CDN_REGION: ${{ vars.AWS_SDK_CDN_REGION }}

      # The same check as qa-snapshot.yml, in the release environment's form.
      - name: Check the OIDC subject the trust policies expect
        env:
          EXPECTED: repo:payabli@139794672/sdk-android@1311286517:environment:release
        run: |
          claims=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; print(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)).decode())')
          sub=$(printf '%s' "$claims" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sub"])')
          echo "subject presented: $sub"
          if [ "$sub" != "$EXPECTED" ]; then
            echo "::error::this run presents '$sub', and the release role grants '$EXPECTED'."
            echo "::error::GitHub's immutable subject claim setting for this repository may have moved."
            echo "::error::The trust policies are Terraform in payabli/infrastructure, frontend/cdn/oidc.tf."
            exit 1
          fi

      # For the uploader, and the tags and main the steps below read. Named by SHA: a branch ref makes the
      # checkout pin origin/main back to the dispatch-time commit when main has moved since, and the checks
      # below need main as it is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Again here, where the tag is created: a release cut while this one waited for approval may have
      # tagged a newer version since the check ran.
      - name: Check the version is not below the newest release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          newest=$(git for-each-ref --format='%(refname:strip=2)' refs/tags | sed -nE "/$release/p" | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::the newest release is $newest, and $VERSION is lower."
            exit 1
          fi

      # Again here, with refs fetched after the approval: an earlier release that was cut while this one
      # waited is not in main yet, and this commit does not hold it.
      - name: Check again that every earlier release is in main and in the commit
        env:
          COMMIT: ${{ needs.check.outputs.commit }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for tag in $(git for-each-ref --format='%(refname:strip=2)' refs/tags | sed -nE "/$release/p"); do
            tagged=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tag" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$tag" "$VERSION" | sort -V | head -n 1)" = "$tag" ]; then
              if [ "$(git merge-base "$tagged" refs/remotes/origin/main)" != "$tagged" ]; then
                echo "::error::release $tag is not in main: its release or hotfix branch has not merged back with a merge commit."
                exit 1
              fi
              if [ "$(git merge-base "$tagged" "$COMMIT")" != "$tagged" ]; then
                echo "::error::release $tag is not in $COMMIT: merge main into the branch and pass CI there before cutting $VERSION."
                exit 1
              fi
            fi
          done

      # A tag already on this commit is a resumed release and is not pushed twice. One on another commit is
      # a number already spent.
      - name: Create the tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
          COMMIT: ${{ needs.check.outputs.commit }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=
          if [ -n "$(git tag --list "$VERSION")" ]; then
            tagged=$(git rev-parse "refs/tags/$VERSION^{commit}")
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$COMMIT" ]; then
            echo "::error::tag $VERSION already names $tagged, not $COMMIT. Take the next version."
            exit 1
          fi
          if [ -z "$tagged" ]; then
            # GitHub's host keys come from its API over HTTPS, so the SSH connection is verified rather
            # than trusted on first use.
            umask 077
            key="$RUNNER_TEMP/release-key"
            hosts="$RUNNER_TEMP/github-known-hosts"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key"
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Payabli Android SDK $VERSION, dispatched by $GITHUB_TRIGGERING_ACTOR" "$COMMIT"
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$VERSION"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staging-repo
          path: build/staging-repo

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_SDK_CDN_REGION }}

      # The account comes off the role ARN, so there is one copy of it. Re-running this job against the
      # same build reports every key already written as present. A rebuild does not: its bytes differ,
      # and the uploader refuses a key that holds different ones. Unbuffered, so a cancelled upload still
      # logs the keys it wrote.
      - name: Upload the staging tree
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ROLE_ARN: ${{ vars.AWS_RELEASE_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
          PYTHONUNBUFFERED: "1"
        run: |
          AWS_SDK_CDN_ACCOUNT=$(echo "$ROLE_ARN" | cut -d: -f5)
          export AWS_SDK_CDN_ACCOUNT
          python3 .github/scripts/publish_staging.py --prefix maven --version "$VERSION"

      # Notes only. The binary is at the Maven origin, and a release asset cannot front a Maven layout. A
      # re-run whose release already exists leaves it as it is.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.version }}
          # Through the environment, so the text is never parsed as shell.
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq ".[] | select(.tagName == \"$TAG\") | .tagName")
          if [ -n "$existing" ]; then
            echo "release $TAG already exists"
          else
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Payabli Android SDK $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
