name: QA snapshot

# Publishes a release candidate of every module to /maven-qa on the artifact origin.
#
# A QA snapshot and a release carry the same artifact. What differs is the version qualifier and the
# channel's overwrite policy: an integrator selects SANDBOX or PRODUCTION at runtime, so there is no
# build that reaches anything else, and `payabli.publish` refuses to publish while
# payabli.sdk.extraEnvironments is set.
#
# Branch only. The snapshot role trusts refs/heads/*, so a tag cannot assume it, exactly as a branch
# cannot assume the release role.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One publish at a time across every ref, not one per ref: two refs stamping in the same UTC second
  # against the same base produce one identifier, and the first writer keeps the coordinate.
  #
  # Never cancelled. A run interrupted mid-upload leaves a partial tree under its own identifier, which
  # the next run does not adopt because it stamps a new one; on a prunable channel that is litter rather
  # than a coordinate anyone asked for.
  group: qa-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Publish a QA snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the OIDC role that writes the bucket. No long-lived AWS key exists in this repository.
      id-token: write
    env:
      # The release identity, because every build reads /maven whatever it publishes to. The QA pair
      # writes /maven-qa and reads nothing.
      PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
      PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
    steps:
      # SHA-pinned, as every workflow here pins what it uses: this job holds a repository credential
      # and mints an AWS publishing credential, and a mutable tag is resolved at run time by whoever
      # controls it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # Variables rather than secrets: a role ARN is an identifier that works only alongside this
      # repository's OIDC identity, and masking it makes every AccessDenied unreadable.
      - name: Check the channel is provisioned
        run: |
          missing=
          [ -n "$AWS_MAVEN_QA_PUBLISH_ROLE_ARN" ] || missing="$missing AWS_MAVEN_QA_PUBLISH_ROLE_ARN"
          [ -n "$AWS_SDK_CDN_BUCKET" ] || missing="$missing AWS_SDK_CDN_BUCKET"
          [ -n "$AWS_SDK_CDN_REGION" ] || missing="$missing AWS_SDK_CDN_REGION"
          if [ -n "$missing" ]; then
            echo "::error::unset repository variable(s):$missing"
            exit 1
          fi
        env:
          AWS_MAVEN_QA_PUBLISH_ROLE_ARN: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
          AWS_SDK_CDN_REGION: ${{ vars.AWS_SDK_CDN_REGION }}

      # Immutable subject claims are a repository setting that anyone can flip in either direction, and
      # the trust policies live in another repository's Terraform, which will not notice. The two then
      # disagree and the assume fails naming IAM, which is where it sends the reader — a dispatched run
      # once spent an afternoon there. This compares the claim the run actually presents.
      #
      # The token is read here rather than the setting: the setting needs repository-admin scope, and
      # what the role matches on is the claim.
      - name: Check the OIDC subject the trust policies expect
        env:
          # The branch form, not the prefix: the snapshot role trusts refs/heads/* only, and a dispatch
          # can be started on a tag, whose subject shares the prefix and fails at the assume.
          EXPECTED: repo:payabli@139794672/sdk-android@1311286517:ref:refs/heads/
        run: |
          claims=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; print(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)).decode())')
          sub=$(printf '%s' "$claims" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sub"])')
          echo "subject presented: $sub"
          case "$sub" in
            "$EXPECTED"*) ;;
            *)
              echo "::error::this run presents '$sub', and the snapshot role grants '$EXPECTED*'."
              echo "::error::Either this run is on a tag, which that role never trusts, or GitHub's"
              echo "::error::immutable subject claim setting for this repository has moved. The trust"
              echo "::error::policies are Terraform in payabli/infrastructure, frontend/cdn/oidc.tf."
              exit 1
              ;;
          esac

      # The committed property names the version under development; the stamp makes each build's
      # coordinate unique, so no two builds answer to one identifier and a tester can pin the one they
      # tested. UTC, year-first, because a pre-release identifier of only digits is compared numerically
      # and must not carry a leading zero.
      - name: Name this build
        id: name
        run: |
          base=$(grep '^payabli.version=' gradle.properties | cut -d= -f2)
          echo "version=${base}-QA.$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish to the staging directory
        env:
          VERSION: ${{ steps.name.outputs.version }}
        run: ./gradlew publish -Ppayabli.version="$VERSION"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_SDK_CDN_REGION }}

      # The account comes off the role ARN this run assumed rather than being configured a second time,
      # so there is one copy of it. The script passes it as --expected-bucket-owner, so a mistyped bucket
      # name resolving to somebody else's bucket is refused rather than written to.
      - name: Upload the staging tree
        env:
          VERSION: ${{ steps.name.outputs.version }}
          ROLE_ARN: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
        run: |
          AWS_SDK_CDN_ACCOUNT=$(echo "$ROLE_ARN" | cut -d: -f5)
          export AWS_SDK_CDN_ACCOUNT
          python3 .github/scripts/publish_staging.py --prefix maven-qa --version "$VERSION"
