name: QA snapshot

# Publishes a release candidate of every module to /maven-qa. The snapshot role trusts refs/heads/*, so a
# run on a tag is refused at the assume; the subject check below says so before it gets there.

on:
  workflow_dispatch:
  # No trigger of its own for main: as a called workflow it is a job with `needs`, which is how it
  # waits for the suites rather than running beside them.
  workflow_call:
    # Named, so a caller hands over these two and not the repository's other twelve. This job mints the
    # publishing identity, and `secrets: inherit` would put the vendor registry token and the live
    # client credentials in the same place.
    secrets:
      PAYABLI_MAVEN_US_PROD:
        required: true
      PAYABLI_MAVEN_PW_PROD:
        required: true

permissions:
  contents: read

# Naming bash is what turns `-o pipefail` on: an unset `shell:` runs `bash -e`, where a pipeline reports
# the last command's status and the failure of anything left of a `|` is dropped. Defaults do not reach a
# called workflow from its caller, so this is declared here as well as in ci.yml.
defaults:
  run:
    shell: bash

jobs:
  # The gate, and it publishes nothing. A dispatch answers to no CI run and any branch can start one, so
  # it waits here for the release environment's reviewers. A called run reached main through branch
  # protection and waits for every suite, so it skips this and is not held again.
  #
  # **This stops an unmodified dispatch and it is not an authorization boundary.** A dispatch runs the
  # workflow file from the ref it names, so a branch copy with this job deleted publishes with nothing to
  # approve: the job below still receives the repository's secrets and still presents a `refs/heads/*`
  # subject the snapshot role trusts. Nothing written in this file can close that, because the file is
  # what the attacker edits.
  #
  # What would close it is the role's trust policy, which is Terraform in payabli/infrastructure. iOS is
  # not in this position for a reason worth copying: its deploy key lives inside its release environment,
  # so a branch copy omitting the environment cannot read the credential at all. The equivalent here is a
  # role trusted on `environment:` rather than on a ref, which is what card-reader-mirror already does.
  #
  # A separate job because the environment cannot go on the one below. The OIDC subject for a job with an
  # environment carries `environment:<name>` and no ref, as card-reader-mirror.yml records, and the
  # snapshot role trusts `refs/heads/*`: naming an environment there fails the subject check and then the
  # assume. This job requests no token, so the claim it presents is nobody's concern.
  approve:
    name: Approve a hand-run snapshot
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - run: echo "approved for $GITHUB_REF"

  publish:
    name: Publish a QA snapshot
    needs: [approve]
    # Either the gate passed, or this is the one call that is allowed to skip it. A skipped dependency is
    # not a failure, so reading only `!= 'failure'` accepted every caller that skipped the gate, and the
    # caller is not only ci.yml: any workflow in the repository can call this one, and a push-triggered
    # one added on a feature branch would hand over the secrets, present a `refs/heads/*` subject the
    # role trusts, and publish with no CI and no approval. Naming the event and the ref is what refuses
    # that, and both are the caller's. `always()` in place of `!cancelled()` would publish through a
    # refusal as well.
    if: >-
      ${{ !cancelled() && (needs.approve.result == 'success'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    # On this job rather than on the workflow. One group across every ref, not one per ref: two refs
    # stamping in the same UTC second reach one identifier, and the first writer keeps the coordinate.
    # At the workflow level the gate above would sit inside the group, so a dispatch waiting for a
    # reviewer holds the only slot and every snapshot from main queues behind it for as long as nobody
    # answers. A pending run is also replaced when a newer one queues, so those would not merely be late.
    concurrency:
      group: qa-snapshot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No ref: a called workflow checks out the caller's commit, which is the one CI is testing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # Variables rather than secrets: masking a role ARN makes every AccessDenied unreadable.
      - name: Check the channel is provisioned
        run: |
          missing=
          [ -n "$AWS_MAVEN_QA_PUBLISH_ROLE_ARN" ] || missing="$missing AWS_MAVEN_QA_PUBLISH_ROLE_ARN"
          [ -n "$AWS_SDK_CDN_BUCKET" ] || missing="$missing AWS_SDK_CDN_BUCKET"
          [ -n "$AWS_SDK_CDN_REGION" ] || missing="$missing AWS_SDK_CDN_REGION"
          if [ -n "$missing" ]; then
            echo "::error::unset repository variable(s):$missing"
            exit 1
          fi
        env:
          AWS_MAVEN_QA_PUBLISH_ROLE_ARN: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
          AWS_SDK_CDN_REGION: ${{ vars.AWS_SDK_CDN_REGION }}

      # The subject setting is GitHub's and the trust policies are Terraform elsewhere, so the two can
      # disagree and the assume then fails naming IAM. Reads the claim rather than the setting, which
      # needs repository-admin scope.
      - name: Check the OIDC subject the trust policies expect
        env:
          # The branch form: a dispatch can be started on a tag, whose subject shares the prefix.
          EXPECTED: repo:payabli@139794672/sdk-android@1311286517:ref:refs/heads/
        run: |
          claims=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; print(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)).decode())')
          sub=$(printf '%s' "$claims" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sub"])')
          echo "subject presented: $sub"
          case "$sub" in
            "$EXPECTED"*) ;;
            *)
              echo "::error::this run presents '$sub', and the snapshot role grants '$EXPECTED*'."
              echo "::error::Either this run is on a tag, which that role never trusts, or GitHub's"
              echo "::error::immutable subject claim setting for this repository has moved. The trust"
              echo "::error::policies are Terraform in payabli/infrastructure, frontend/cdn/oidc.tf."
              exit 1
              ;;
          esac

      # UTC and year-first: a pre-release identifier of only digits is compared numerically and must not
      # carry a leading zero.
      - name: Name this build
        id: name
        run: |
          base=$(grep '^payabli.version=' gradle.properties | cut -d= -f2)
          echo "version=${base}-QA.$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      # The release identity, on the two steps that resolve the card reader and nowhere else. Checkout,
      # the OIDC check and the upload read nothing from /maven.
      #
      # A dispatch answers to no CI run, so it runs the unit suites itself. Called by CI they are skipped,
      # because the run calling it has already passed them and waits for the instrumented ones too, which
      # this step does not carry. build-logic is an included build, so no task in the main build reaches
      # its tests and it takes its own invocation.
      - name: Unit tests
        if: github.event_name == 'workflow_dispatch'
        env:
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: |
          ./gradlew :core:test :payin:test :telemetry:test :testutils:test :taptopay:test :example:test
          ./gradlew -p build-logic test

      - name: Publish to the staging directory
        env:
          VERSION: ${{ steps.name.outputs.version }}
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: ./gradlew publish -Ppayabli.version="$VERSION"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_SDK_CDN_REGION }}

      # The account comes off the role ARN, so there is one copy of it. The script passes it as
      # --expected-bucket-owner, so a mistyped bucket that resolves to someone else's is refused.
      - name: Upload the staging tree
        env:
          VERSION: ${{ steps.name.outputs.version }}
          ROLE_ARN: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
        run: |
          AWS_SDK_CDN_ACCOUNT=$(echo "$ROLE_ARN" | cut -d: -f5)
          export AWS_SDK_CDN_ACCOUNT
          python3 .github/scripts/publish_staging.py --prefix maven-qa --version "$VERSION"
