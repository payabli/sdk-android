name: QA snapshot

# Publishes a release candidate of every module to /maven-qa, from a commit somebody names, and only when
# somebody dispatches it. A merge to main publishes nothing.
#
# The snapshot role trusts the qa-snapshot environment and no ref. The OIDC subject of a job in an
# environment carries `environment:<name>` in place of the ref, so a branch copy of this file with the
# environment deleted presents a subject the role refuses, and the environment's reviewer is who may
# publish, from any branch. A reviewer approves a deployment, not a diff: the run summary names the commit,
# and the approver opens it.

on:
  workflow_dispatch:
    inputs:
      # Named rather than taken from the branch's head, so a push landing between the decision and the
      # dispatch is not what gets published.
      commit:
        description: "Full 40-character SHA of the commit to publish, on the branch this is dispatched from"
        required: true
        type: string

permissions:
  contents: read

# Naming bash is what turns `-o pipefail` on: an unset `shell:` runs `bash -e`, where a pipeline reports
# the last command's status and the failure of anything left of a `|` is dropped.
defaults:
  run:
    shell: bash

jobs:
  # Before the approval, and holding nothing that can publish, so a wrong commit is refused without
  # anyone being asked.
  check:
    name: Check the commit can be published
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ inputs.commit }}
    steps:
      # A full SHA and nothing shorter, so the commit approved is not a prefix that resolves to another.
      - name: Check the commit is named in full
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::a snapshot names the full 40-character commit SHA, not '$COMMIT'."
            exit 1
          fi

      # A missing environment is created on first use with no reviewer, and the snapshot role trusts its
      # subject, so the publish would need nobody's approval. A missing one answers 404, which fails here.
      - name: Check the qa-snapshot environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/qa-snapshot" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::the qa-snapshot environment requires no reviewer, so nobody would approve this."
            exit 1
          fi

      # All of history, so the check below can see the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      # A tag carries no branch to be on, and the reviewer is approving a branch's commit.
      - name: Check the commit is on the branch dispatched
        env:
          COMMIT: ${{ inputs.commit }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::a snapshot is dispatched from a branch, not $GITHUB_REF."
            exit 1
          fi
          if [ "$(git merge-base "$COMMIT" "origin/$BRANCH")" != "$COMMIT" ]; then
            echo "::error::$COMMIT is not on $BRANCH."
            exit 1
          fi
          # On the run's page, so the approver sees what the approval publishes.
          {
            echo "Publishing a snapshot of \`$BRANCH\` at \`$COMMIT\`:"
            echo
            echo "> $(git log -1 --format=%s "$COMMIT")"
          } >> "$GITHUB_STEP_SUMMARY"

  # The suites, on their own so a flaky one is re-run without rebuilding. A dispatch answers to no CI
  # run, so it runs the unit suites itself. It does not carry the instrumented suites, ktlint or lint.
  # build-logic is an included build, so no task in the main build reaches its tests and it takes its own
  # invocation.
  test:
    name: Test the snapshot
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # The release identity, on the steps that resolve the card reader and nowhere else.
      - name: Unit tests
        env:
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: |
          ./gradlew :core:test :payin:test :telemetry:test :testutils:test :taptopay:test :example:test
          ./gradlew -p build-logic test

  # The staging tree, beside the suites, and on its own so a packaging failure is re-run without them. It
  # stamps the identifier, so a re-run of the publish uploads the same version from the same tree.
  build:
    name: Build the snapshot
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # See the note on the first setup-gradle in ci.yml.
          cache-provider: basic

      # UTC and year-first: a pre-release identifier of only digits is compared numerically and must not
      # carry a leading zero.
      - name: Name this build
        id: name
        run: |
          base=$(grep '^payabli.version=' gradle.properties | cut -d= -f2)
          echo "version=${base}-QA.$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish to the staging directory
        env:
          VERSION: ${{ steps.name.outputs.version }}
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: ./gradlew publish -Ppayabli.version="$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-repo
          path: build/staging-repo
          if-no-files-found: error

  # The approval, after the suites and the build have passed, so the reviewer approves a tree that exists.
  # It runs no Gradle and sets up no toolchain, so the only code beside the publishing token is this
  # workflow's own.
  publish:
    name: Publish a QA snapshot
    needs: [check, test, build]
    runs-on: ubuntu-latest
    environment: qa-snapshot
    # One publish at a time across every ref. Two refs stamping in the same UTC second reach one identifier,
    # and the second upload then finds every key taken and writes nothing.
    concurrency:
      group: qa-snapshot
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      # Variables rather than secrets: masking a role ARN makes every AccessDenied unreadable.
      - name: Check the channel is provisioned
        run: |
          missing=
          [ -n "$AWS_MAVEN_QA_PUBLISH_ROLE_ARN" ] || missing="$missing AWS_MAVEN_QA_PUBLISH_ROLE_ARN"
          [ -n "$AWS_SDK_CDN_BUCKET" ] || missing="$missing AWS_SDK_CDN_BUCKET"
          [ -n "$AWS_SDK_CDN_REGION" ] || missing="$missing AWS_SDK_CDN_REGION"
          if [ -n "$missing" ]; then
            echo "::error::unset repository variable(s):$missing"
            exit 1
          fi
        env:
          AWS_MAVEN_QA_PUBLISH_ROLE_ARN: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
          AWS_SDK_CDN_REGION: ${{ vars.AWS_SDK_CDN_REGION }}

      # The subject setting is GitHub's and the trust policies are Terraform elsewhere, so the two can
      # disagree and the assume then fails naming IAM. Reads the claim rather than the setting, which
      # needs repository-admin scope.
      - name: Check the OIDC subject the trust policies expect
        env:
          EXPECTED: repo:payabli@139794672/sdk-android@1311286517:environment:qa-snapshot
        run: |
          claims=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; print(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)).decode())')
          sub=$(printf '%s' "$claims" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sub"])')
          echo "subject presented: $sub"
          if [ "$sub" != "$EXPECTED" ]; then
            echo "::error::this run presents '$sub', and the snapshot role grants '$EXPECTED'."
            echo "::error::GitHub's immutable subject claim setting for this repository may have moved."
            echo "::error::The trust policies are Terraform in payabli/infrastructure, frontend/cdn/oidc.tf."
            exit 1
          fi

      # For the uploader alone: this workflow's own commit, not the one being published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staging-repo
          path: build/staging-repo

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_SDK_CDN_REGION }}

      # The account comes off the role ARN, so there is one copy of it. The script passes it as
      # --expected-bucket-owner, so a mistyped bucket that resolves to someone else's is refused.
      # Unbuffered, so a cancelled upload still logs the keys it wrote.
      - name: Upload the staging tree
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ROLE_ARN: ${{ vars.AWS_MAVEN_QA_PUBLISH_ROLE_ARN }}
          AWS_SDK_CDN_BUCKET: ${{ vars.AWS_SDK_CDN_BUCKET }}
          PYTHONUNBUFFERED: "1"
        run: |
          AWS_SDK_CDN_ACCOUNT=$(echo "$ROLE_ARN" | cut -d: -f5)
          export AWS_SDK_CDN_ACCOUNT
          python3 .github/scripts/publish_staging.py --prefix maven-qa --version "$VERSION"
