name: Nightly

# The full suite once a day, plus on demand. Deliberately neither on push nor on pull_request, and
# deliberately not a required check.
#
# `ci.yml` is the per-PR gate and stays fast. This runs every unit test, the card-present module included,
# and the instrumented tests of :core and :payin. The unit tests overlap with ci.yml on purpose, so a
# nightly failure is readable on its own without cross-referencing another run.
#
# Instrumented coverage is :core and :payin, and what is left out is a scope statement rather than an
# oversight. :telemetry holds only the generated ExampleInstrumentedTest and declares no androidx.test:runner,
# so that task would die with ClassNotFoundException before running a thing.
#
#
# Both tiers grow with each capability that binds to a platform API. No count is kept here, because the last
# one went stale inside a single merge; what runs on the emulator is every @Test under core/src/androidTest
# and payin/src/androidTest that is not @ManualDeviceTest, less whatever a module's own build file excludes.
# That is not hypothetical: payin/build.gradle.kts quarantines one form class, four tests, which carry no
# annotation and so are invisible to the filter this step passes. A module can quiet its own tests without
# touching this file, so the count here is an upper bound rather than a promise.
#
# :taptopay and :example run their **unit** tests here, in the `card-present` job, which holds the card
# reader credential, and no instrumented test of either runs at all. The emulator is x86_64 and the card reader's
# AAR carries one native library, `jni/arm64-v8a/libmc3.so`, so a test APK linking it cannot install on this
# image: it fails with INSTALL_FAILED_NO_MATCHING_ABIS before a test runs. Card-present instrumented
# coverage needs an arm64 runner or a wired handset, and it is waiting on a job of its own.
#
#
# Why the instrumented half is not a required check: the call-budget test asserts elapsed wall-clock time
# against a stalling server, and a hosted emulator is where that kind of assertion goes flaky. A flaky
# required check teaches people to re-run rather than to read. These are also platform properties that move
# when the platform or AGP moves, not per commit.
#
# Promote to pull_request only after this has been stable for a stretch, and then consider a paths filter on
# core/** and the build files.
#
# Four jobs, and the split is a security boundary rather than organisation. Step-scoping a secret does not
# isolate it from code that runs later in the same job, so the only way the third-party emulator action
# cannot reach a secret is for that secret to live in another job.
#
#   * `nightly` runs the unit and instrumented tests and the emulator action. It holds no secret and takes
#     nothing from a job that does.
#   * `card-present` runs the card-present unit tests with the card reader credential. It runs no
#     third-party action, and every action in it is pinned to a commit.
#   * `verdict` gathers both jobs' results, writes the report facts and fails the run if a suite failed.
#   * `report` holds the Slack bot token and runs nothing third-party. A test job that times out or dies
#     still gets announced.
#
# Note what the triggers below can and cannot do from a feature branch. A scheduled run never fires from one.
# A dispatch can be pointed at one, because this workflow is on the default branch and the branch is chosen
# when it is run, but it runs the whole suite and the report job posts to the channel, so it is a loud way to
# test a branch. A workflow that is not yet on main does not appear in the Run workflow menu at all. For a
# quick check, use a short-lived probe branch with a temporary push trigger.
on:
  workflow_dispatch:
  schedule:
    # 03:00 Pacific, expressed as 10:00 UTC. GitHub cron is UTC only and has no time zone setting, so this
    # is 3am during PDT and 2am during PST: it shifts by an hour twice a year rather than following the
    # clock. Change the hour to 11 if the winter time matters more than the summer one.
    - cron: '0 10 * * *'

concurrency:
  # A manual dispatch landing during a nightly must not boot a second emulator on the same ref.
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `bash` turns on pipefail, so a failure left of a `|` fails the step.
defaults:
  run:
    shell: bash

env:
  # Never --info or --debug here: verbose Gradle logs can print repository credentials.
  GRADLE_OPTS: -Dorg.gradle.console=plain
  # Leads every Slack message: the collector stamps it into the facts. `nightly-report.yml`, which posts
  # them, states it too, for the message sent when no facts arrived. Stated rather than inferred, because a
  # script that guesses the platform would eventually guess wrong.
  PLATFORM: Android

jobs:
  nightly:
    name: Unit + instrumented tests
    runs-on: ubuntu-latest
    # A backstop that must stay well above the sum of the step bounds below, currently 65 minutes. If the
    # job bound is close to that sum, steps running near their limits let the job time out first, which takes
    # the collect step and the suite gate with it. Since reporting moved to its own job a job timeout is now
    # announced rather than silent, but the run would still end without a verdict of its own, so the headroom
    # is the point rather than slack. Raise this whenever a step bound goes up.
    #
    # For scale, the observed run is a few minutes: unit tests under a minute, instrumented around two and a
    # half. The bounds are set to catch a wedge, not to be tight.
    timeout-minutes: 90
    # Read by `verdict`. A job that dies before a step records an outcome leaves it empty, which the
    # collector reads as red.
    outputs:
      unit: ${{ steps.unit.outcome }}
      instrumented: ${{ steps.instrumented.outcome }}
    env:
      # One place for the image coordinates, because the AVD cache key has to agree with the two emulator
      # steps below or the cache silently never hits.
      #
      # 34 is a documented api-level for this action; plain "35" is not, and the accepted values are 23, 29,
      # 33, 34, 35-ext15 and Baklava. google_apis rather than default, because default images are not
      # published for every recent level. x86_64 needs API 21 or above, which is satisfied.
      API_LEVEL: '34'
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # `basic` keeps caching on the open-source implementation; ci.yml carries why.
          cache-provider: basic

      # Cheap and emulator-free, so it runs first: a compile or unit-test break should not wait on a boot.
      #
      # The coverage task rather than the plain test task, because it depends on it: this writes both the
      # JUnit results and the JaCoCo report, and the Slack summary reports coverage as well as failures.
      # :example is not here: its `cardPresent` variant links :taptopay, so its build needs the credential and
      # it runs in the `card-present` job.
      #
      # continue-on-error throughout, so a failure still reaches Slack with its detail instead of aborting
      # the job at the first red suite. The final step turns any failure back into a red run.
      # --continue is load-bearing, not tidiness. `continue-on-error` is a GitHub step setting and does
      # nothing inside a Gradle invocation: without it Gradle abandons the task graph at the first failure,
      # so a broken :core would stop :payin and :telemetry from running at all and the report would
      # describe part of the suite as though it were the whole of it.
      - name: Unit tests and coverage
        id: unit
        continue-on-error: true
        timeout-minutes: 20
        # --max-workers=1 for the reason recorded in ci.yml's build job: concurrent report workers
        # draw from a shared classloader cache and one of them meets a closed jar handle.
        run: ./gradlew --continue --max-workers=1
          :core:createDebugUnitTestCoverageReport
          :payin:createDebugUnitTestCoverageReport
          :telemetry:createDebugUnitTestCoverageReport
          :testutils:createDebugUnitTestCoverageReport

      # Required on ubuntu-latest, and the step most often left out. Without it the emulator runs
      # unaccelerated, which is the one condition that makes the call-budget assertion flaky.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}

      # Cache miss only. Boots once to write a snapshot the test step then reuses, which measured about
      # 80 seconds off a warm run.
      #
      # Note what is absent: no -no-snapshot-save, and disable-animations left false. Both are deliberate,
      # because this step exists to write the snapshot rather than to run anything.
      # Pinned to a commit, as every third-party action in this repository is, and Dependabot keeps the pin
      # current: a tag runs whatever its owner points it at on the day, and a commit names one snapshot.
      #
      # The job split still matters: step-scoping a credential does not isolate it from code that ran earlier
      # in the same job, so this job holds none. The Slack post runs in `nightly-report.yml`, and the card
      # reader credential lives in the `card-present` job, which this job takes nothing from.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests
        id: instrumented
        continue-on-error: true
        # The wedge this guards against. A step timeout fails the step; the job survives to report it.
        timeout-minutes: 20
        # **No card reader credential here, because no card-present task runs here.** This emulator is
        # x86_64 and the card reader's AAR carries one native library, `jni/arm64-v8a/libmc3.so`, with no
        # 32-bit and no x86 build. So `:taptopay`'s test APK - and `:example`'s, which links it - fail to
        # install with INSTALL_FAILED_NO_MATCHING_ABIS before a test runs. Adding those tasks bought no
        # coverage and handed the card reader credential to the third-party emulator action for nothing.
        #
        # Card-present instrumented coverage needs an arm64 runner or a wired handset, which is the job it
        # is waiting on rather than something this one can be talked into.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          # -no-snapshot-save so this run reuses the cached snapshot and does not rewrite it.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # :core and :payin, which is every module whose test APK can install on this image. The note at
          # the top of the file has why card-present is not here and what it would need.
          #
          # --continue because the two tasks are independent and Gradle otherwise "aborts execution and fails
          # the build when any task fails", which leaves whether the second module ran at all down to how the
          # two happened to be scheduled. Measured with :core deliberately failing: :payin ran anyway, which
          # is the sort of thing that stops holding on a busier machine.
          #
          # notAnnotation excludes both manual tiers and names both annotations, because an androidTest source
          # set is not visible to another module's: :payin declares its own rather than referencing :core's,
          # so naming one would leave the other module's manual tier running. The argument takes a
          # comma-separated list.
          #
          # What the annotations mark is "this job cannot answer the question", which is three different
          # reasons and not one. Two of :core's are hardware: an emulator's Keystore is software-backed, so a
          # secure-element assertion fails with SECURITY_LEVEL_SOFTWARE however correct the code is. The third
          # is a provisioning gap rather than a property of emulators: the slow-link check passes on an
          # emulator and is parked only because this job starts no throttled broker beside it. :payin's marks
          # one live-flow test needing client credentials no repository holds, and nothing in it requires a
          # phone either.
          #
          # So two of the three move into this job the day it provisions what they need, and only the hardware
          # pair is permanent. Reading the Keystore reasoning as covering the tier would make a queued
          # workflow change look impossible. Each ManualDeviceTest states its own reason and the command that
          # runs its tier.
          #
          # Excluded rather than skipped in both cases, and the difference is the point: measured, this leaves
          # `skipped="0"` in the results XML and the manual tests absent from it entirely. An `@Ignore` would
          # have reported a standing skip in Slack every night, and a permanent skip is indistinguishable from
          # a regression that started skipping.
          #
          # Three classes are excluded by their own module rather than from here, and this step cannot see any
          # of them: payin/build.gradle.kts names the live tier whenever its credentials are absent, which is
          # always in this step, and names one quarantined form class outright; example/build.gradle.kts names
          # the walkthrough unless it is asked for. All three travel under `notClass`.
          #
          # A -P runner argument replaces the DSL's value for the key it names, and merges only in the sense
          # that a different key leaves the first alone. `notAnnotation` above is a different key, which is
          # the whole reason the two coexist. A -P `notClass` here would overwrite those lists and readmit all
          # three, sending real payments from this step, so nothing in this workflow passes one. What this step
          # runs is the annotation filter minus whatever each module excluded.
          # One physical line. A plain scalar folds these into spaces, where a literal block would hand the
          # action several lines and it would run each as its own `sh -c`, so the first would run without its
          # arguments and the arguments would run as a command.
          script: ./gradlew --continue :core:connectedAndroidTest :payin:connectedAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.payabli.sdk.core.ManualDeviceTest,com.payabli.sdk.payin.ManualDeviceTest,com.payabli.sdk.taptopay.ManualDeviceTest

      # One archive rather than a glob upload, because upload-artifact roots an archive at the common
      # ancestor of what it matched, so a night on which only one module wrote results would unpack to a
      # different layout. `verdict` unpacks this at the workspace root, where the collector's globs look.
      - name: Pack the results
        if: always()
        run: .github/scripts/pack_results.sh "$RUNNER_TEMP/nightly-results/tests.tgz"

      - name: Upload the results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-results-tests
          path: ${{ runner.temp }}/nightly-results
          retention-days: 7

  card-present:
    name: Unit tests (card-present)
    runs-on: ubuntu-latest
    # The Maven credential is an environment secret, released only to a run on main, release/* or hotfix/*. A
    # dispatch from any other branch is refused at the environment.
    environment: ci-protected
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.unit_card_present.outcome }}
    env:
      # A boolean, not the credential. A step `if:` cannot read the secrets context, so the presence check
      # is rendered here and the credential itself stays on the one step that uses it.
      # Both halves, because the step needs both. With only the password checked, a missing user
      # name ran the step anyway and it failed authentication, which reads as a broken build
      # rather than as the deliberate no-credential skip. settings.gradle.kts's preflight already
      # treats either half missing as incomplete.
      HAS_READER_CREDENTIALS: ${{ secrets.PAYABLI_MAVEN_PW_PROD != '' && secrets.PAYABLI_MAVEN_US_PROD != '' }}
    steps:
      # Pinned, because this job holds a secret and everything that runs in it can reach what an earlier
      # step leaves behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Skipped rather than failed when the credential is absent, matching the card-present job in ci.yml.
      # `--no-daemon` so the credential Gradle read during configuration does not outlive the step.
      - name: Unit tests and coverage (card-present)
        id: unit_card_present
        continue-on-error: true
        timeout-minutes: 10
        if: env.HAS_READER_CREDENTIALS == 'true'
        env:
          PAYABLI_MAVEN_USER: ${{ secrets.PAYABLI_MAVEN_US_PROD }}
          PAYABLI_MAVEN_PASSWORD: ${{ secrets.PAYABLI_MAVEN_PW_PROD }}
        run: ./gradlew --no-daemon --max-workers=1 :taptopay:createDebugUnitTestCoverageReport
          :example:createCardPresentDebugUnitTestCoverageReport

      - name: Pack the results
        if: always()
        run: .github/scripts/pack_results.sh "$RUNNER_TEMP/nightly-results/card-present.tgz"

      - name: Upload the results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-results-card-present
          path: ${{ runner.temp }}/nightly-results
          retention-days: 7

  # Decides the run. It holds no secret and runs no third-party action, and it is where the culprit lookup
  # has the full git history it needs.
  verdict:
    name: Verdict
    needs: [nightly, card-present]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.collect.outputs.verdict }}
    steps:
      # Full history, because the Slack report attributes each failure with `git log -1 -- <file>`. On the
      # action's default depth of 1 git attributes the single grafted commit to every path, so every failure
      # would name whatever landed last.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A missing archive is a job that wrote nothing, which the collector reports as red.
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-results-*
          path: ${{ runner.temp }}/nightly-results

      - name: Unpack the results
        run: |
          shopt -s nullglob
          for archive in "$RUNNER_TEMP"/nightly-results/*/*.tgz; do
            tar -xzf "$archive"
          done

      # Reads the reports Gradle wrote and decides the verdict: coverage, green or red with the exact failure
      # count, only the tests that failed, and a probable culprit per failure. Writes the stack traces to this
      # job's summary, which is what the Slack report links at, and a facts file for `report` to render. A
      # trace over 4000 characters is trimmed in the middle, and the summary names the nightly-reports
      # artifact as where the unabridged JUnit XML is.
      - name: Collect the report
        id: collect
        timeout-minutes: 5
        env:
          UNIT_OUTCOME: ${{ needs.nightly.outputs.unit }}
          INSTRUMENTED_OUTCOME: ${{ needs.nightly.outputs.instrumented }}
          # Without it a :taptopay failure before any JUnit XML is written, during dependency resolution or
          # compilation, would leave the other suites looking green while the run went red.
          CARD_PRESENT_OUTCOME: ${{ needs.card-present.outputs.outcome }}
          # The modules the instrumented step ran. The collector checks each one wrote results, because the
          # suite total cannot: a module that writes nothing is hidden by a sibling that wrote plenty.
          #
          # **This list and that step's task list are one fact in two places, and they must agree.** W10
          # compares them. `:example` is absent because its test APK cannot install on an x86_64 emulator.
          #
          # If a flavoured module is ever listed here, what follows its colon is the results directory under
          # `connected/`, not a variant name: a flavoured module writes `<buildType>/flavors/<flavor>`.
          INSTRUMENTED_MODULES: core,payin
          # The same question for the two unit suites, which each span several modules: a module
          # that writes nothing is hidden by a sibling that wrote plenty, and the suite total is
          # never zero. Each list is that job's gradle task list in a second place, and W10
          # compares them.
          UNIT_MODULES: core,payin,telemetry,testutils
          CARD_PRESENT_MODULES: taptopay,example
        run: python3 .github/scripts/nightly_report.py "$RUNNER_TEMP/nightly-facts/nightly-facts.json"

      # Its own artifact and a single-file directory, so the path `report` downloads is the same every night.
      # Non-blocking: a lost facts file costs the report, and `report` says so rather than going quiet.
      - name: Upload the report facts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-facts
          path: ${{ runner.temp }}/nightly-facts
          retention-days: 7

      # The XML is the only way to read a failure once the runner is gone. Non-blocking, because an
      # artifact-service error is infrastructure rather than a suite result.
      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/androidTest-results/**
          retention-days: 7

      # Turns any failure back into a red run. An empty outcome is a job that died before its step recorded
      # one, and a job that did not succeed is red whatever its outputs say.
      - name: Fail if any suite failed
        if: always()
        run: |
          failed=0
          for outcome in "${{ needs.nightly.outputs.unit }}" "${{ needs.nightly.outputs.instrumented }}"; do
            [ "$outcome" = "success" ] || failed=1
          done
          case "${{ needs.card-present.outputs.outcome }}" in success|skipped) ;; *) failed=1 ;; esac
          for result in "${{ needs.nightly.result }}" "${{ needs.card-present.result }}"; do
            [ "$result" = "success" ] || failed=1
          done
          # The collector's own verdict, so the run and the notification cannot disagree: a task that
          # succeeded while discovering no tests is red there and must be red here.
          if [ "${{ steps.collect.outputs.verdict }}" != "green" ]; then
            failed=1
          fi
          if [ "$failed" -eq 1 ]; then
            echo "::error::A test suite failed or reported no results. See the Slack report and the logs."
            exit 1
          fi
          echo "All suites passed."
