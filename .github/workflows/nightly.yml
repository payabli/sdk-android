name: Nightly

# The full suite once a day, plus on demand. Deliberately neither on push nor on pull_request, and
# deliberately not a required check.
#
# `ci.yml` is the per-PR gate and stays fast. This is the complete signal: every unit test including the
# card-present module, and the instrumented tests that only an emulator can run. The unit tests overlap with
# ci.yml on purpose, so a nightly failure is readable on its own without cross-referencing another run.
#
# Why the instrumented half is not a required check: the call-budget test asserts elapsed wall-clock time
# against a stalling server, and a hosted emulator is where that kind of assertion goes flaky. A flaky
# required check teaches people to re-run rather than to read. These are also platform properties that move
# when the platform or AGP moves, not per commit.
#
# Promote to pull_request only after this has been stable for a stretch, and then consider a paths filter on
# core/** and the build files. See PLA-2306.
#
# Note both triggers below only work from the default branch: a scheduled run never fires from a feature
# branch, and this workflow does not appear in the Run workflow menu until it is on main. So a branch cannot
# be validated by dispatching it; use a short-lived probe branch with a temporary push trigger instead.
on:
  workflow_dispatch:
  schedule:
    # 03:00 Pacific, expressed as 10:00 UTC. GitHub cron is UTC only and has no time zone setting, so this
    # is 3am during PDT and 2am during PST: it shifts by an hour twice a year rather than following the
    # clock. Change the hour to 11 if the winter time matters more than the summer one.
    - cron: '0 10 * * *'

concurrency:
  # A manual dispatch landing during a nightly must not boot a second emulator on the same ref.
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never --info or --debug here: verbose Gradle logs can print repository credentials.
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  nightly:
    name: Unit + instrumented tests
    runs-on: ubuntu-latest
    # Generous on purpose, and deliberately not the real bound. The step timeouts below do the work, so a
    # wedge fails one step and the job carries on to report it. A tight job-level timeout would cancel the
    # job instead, taking the `if: always()` Slack step with it, and the one-message-per-run contract would
    # break in precisely the wedged-emulator case the timeout exists for.
    timeout-minutes: 90
    env:
      # One place for the image coordinates, because the AVD cache key has to agree with the two emulator
      # steps below or the cache silently never hits.
      #
      # 34 is a documented api-level for this action; plain "35" is not, and the accepted values are 23, 29,
      # 33, 34, 35-ext15 and Baklava. google_apis rather than default, because default images are not
      # published for every recent level. x86_64 needs API 21 or above, which is satisfied.
      API_LEVEL: '34'
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      # A boolean, not the credential. The token itself is scoped to the one step that needs it, but a step
      # `if:` cannot read the secrets context, so the presence check has to live here as a rendered string.
      HAS_GPR_CREDENTIALS: ${{ secrets.GPR_TOKEN != '' }}
      # Leads the Slack report. Stated rather than inferred, because both platform SDKs can post into the
      # same channel and a script that guesses the platform would eventually guess wrong.
      PLATFORM: Android
    steps:
      # Full history, because the Slack report attributes each failure with `git log -1 -- <file>`. On the
      # action's default depth of 1 that does not merely come back empty: git attributes the single grafted
      # commit to every path, so every failure would name whatever landed last. A confidently wrong culprit
      # is worse than none. Measured on a --depth 1 clone before changing this.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # Cheap and emulator-free, so it runs first: a compile or unit-test break should not wait on a boot.
      #
      # The coverage task rather than the plain test task, because it depends on it: this writes both the
      # JUnit results and the JaCoCo report, and the Slack summary reports coverage as well as failures.
      # :example has no coverage task, matching ci.yml, so it runs its tests directly.
      #
      # continue-on-error throughout, so a failure still reaches Slack with its detail instead of aborting
      # the job at the first red suite. The final step turns any failure back into a red run.
      # --continue is load-bearing, not tidiness. `continue-on-error` is a GitHub step setting and does
      # nothing inside a Gradle invocation: without it Gradle abandons the task graph at the first failure,
      # so a broken :core would stop :payin, :telemetry and :example from running at all and the report
      # would describe part of the suite as though it were the whole of it.
      - name: Unit tests and coverage
        id: unit
        continue-on-error: true
        timeout-minutes: 25
        run: ./gradlew --continue
          :core:createDebugUnitTestCoverageReport
          :payin:createDebugUnitTestCoverageReport
          :telemetry:createDebugUnitTestCoverageReport
          :example:test

      # Separate because :taptopay resolves from the Fiserv GitHub Packages repo. Skipped rather than failed
      # when the credential is absent, matching the card-present job in ci.yml.
      #
      # The credential is declared on this step and nowhere else. Job-level env would put a classic PAT with
      # read:packages into the environment of every other step, including two invocations of a third-party
      # action on a mutable @v2 tag that have no use for it. Least privilege matters more here than symmetry
      # with ci.yml, whose card-present work is a separate job with no third-party action in it.
      - name: Unit tests and coverage (card-present)
        id: unit_card_present
        continue-on-error: true
        timeout-minutes: 15
        if: env.HAS_GPR_CREDENTIALS == 'true'
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew :taptopay:createDebugUnitTestCoverageReport

      # Required on ubuntu-latest, and the step most often left out. Without it the emulator runs
      # unaccelerated, which is the one condition that makes the call-budget assertion flaky.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}

      # Cache miss only. Boots once to write a snapshot the test step then reuses, which measured about
      # 80 seconds off a warm run.
      #
      # Note what is absent: no -no-snapshot-save, and disable-animations left false. Both are deliberate,
      # because this step exists to write the snapshot rather than to run anything.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests
        id: instrumented
        continue-on-error: true
        # The wedge this guards against. A step timeout fails the step; the job survives to report it.
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          # -no-snapshot-save so this run reuses the cached snapshot and does not rewrite it.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Scoped to :core. :taptopay carries minSdk 30 and its instrumented paths need a physical device
          # for attestation and the card reader, so an emulator cannot run them; see PLA-2193.
          script: ./gradlew :core:connectedAndroidTest

      # Posts to #mobile-sdk-nightly-build. Reads the reports Gradle already wrote and sends coverage, a
      # green or red verdict with the exact failure count, only the tests that failed, a probable culprit
      # per failure from git history, and a link to this run.
      #
      # curl rather than a Slack action, on purpose: this repo just moved five actions off a deprecated Node
      # runtime, and a curl post has nothing to pin and no runtime to deprecate.
      #
      # Skipped rather than failed when the webhook secret is absent, so the suite result is never lost to a
      # reporting problem. The URL is passed by env and never echoed; --data @- keeps the payload off the
      # command line too.
      - name: Report to Slack
        id: slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          INSTRUMENTED_OUTCOME: ${{ steps.instrumented.outcome }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set, so no nightly report was posted."
            exit 0
          fi
          python3 .github/scripts/nightly_report.py > "$RUNNER_TEMP/slack.json"
          curl --silent --show-error --fail-with-body \
            -X POST -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/slack.json" "$SLACK_WEBHOOK_URL"

      # The XML results are the only way to read a failure once the runner is gone, and the emulator is not
      # reproducible locally, so upload on failure too.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-reports
          path: |
            **/build/reports/**
            **/build/outputs/androidTest-results/**
          retention-days: 7

      # continue-on-error above keeps the job alive long enough to report. Without this the run would end
      # green with failing tests, which is worse than no nightly at all.
      - name: Fail if any suite failed
        if: always()
        run: |
          failed=0
          for outcome in "${{ steps.unit.outcome }}" "${{ steps.unit_card_present.outcome }}" \
                         "${{ steps.instrumented.outcome }}"; do
            case "$outcome" in failure|cancelled|timed_out) failed=1 ;; esac
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::A test suite failed. See the Slack report and the step logs above."
            exit 1
          fi
          echo "All suites passed."
