name: Live flows (qa)

# One of two entry points into `live-flows.yml`, which carries the whole explanation. This file exists so qa
# and sandbox are separate runs with separate results rather than two jobs whose failures share a verdict.

on:
  workflow_dispatch:
  # The daily schedule is paused, and the cron it carried was 11:00 UTC, an hour behind the nightly. A
  # scheduled run cannot mint a token today, so it would fail every morning and say nothing about the client.
  # Restoring the schedule is the revert of this comment.

concurrency:
  group: live-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/live-flows.yml
    with:
      environment: qa
      # The sample app offers sandbox and production only, so its walkthrough cannot configure itself
      # for qa and would fail before a flow ran. The pay-in tier still runs here, which is what this
      # workflow is for.
      sample-walkthrough: false
    secrets:
      client-id: ${{ secrets.PAYABLI_CLIENT_ID_QA }}
      client-secret: ${{ secrets.PAYABLI_CLIENT_SECRET_QA }}
      entry-point: ${{ secrets.PAYABLI_ENTRY_QA }}
      slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
