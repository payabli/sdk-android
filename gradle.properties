# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true

# Task outputs are reused across builds, and across CI runs because setup-gradle caches the Gradle user
# home this lives in. Measured on a clean tree over the modules ci.yml builds, plus their unit tests: 134
# of 151 tasks executed without it, and 31 of those restored with it. CI starts every run clean, which is
# the case that pays for it.
#
# It applies to a bench build too, which is the point: one behaviour in both places. Pass --no-build-cache
# for a run that has to execute everything. Gradle prunes the local cache itself, and the bookkeeping for
# that is gc.properties in the directory; measured here it holds 27 MB against 5.0 GB for the Gradle caches
# around it.
#
# org.gradle.parallel stays unset, and the reason is not here: ci.yml records the coverage worker race that
# decides it, with its own measurements, and a second copy of that argument is one more thing to keep true.
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Payabli SDK publishing coordinates (shared by every publishable module).
#
# The domain-verified namespace, and the one every module resolves through `payabli.group`. Mobile takes
# it because mobile has published nothing and can: `io.github.payabli` carries `sdk-java`, a server-side
# library with a different audience that is not migrating, and splitting the two SDKs across namespaces
# permanently is what publishing anything under that group in the meantime would cause.
payabli.group=com.payabli
# The version a build carries when nothing overrides it, which is every local build and no publish to a
# remote repository. The release workflow passes `payabli.publishVersion` from the tag it is about to
# create, and a QA build passes `payabli.snapshot`; both are resolved in `payabli.publish`.
payabli.version=0.1.0